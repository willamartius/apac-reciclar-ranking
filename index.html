<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reciclapac</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="ranking-logic.js?v=20261001-exchange-button"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --verde-900:#12301F;
  --verde-800:#173B27;
  --verde-700:#1F5D3F;
  --verde-600:#2C7350;
  --verde-500:#3E8E5A;
  --verde-300:#8FCB9E;
  --verde-100:#E4F1E6;
  --ouro:#C08A22;
  --prata:#8A97A0;
  --bronze:#B0703F;
  --bg:#F5F8F4;
  --card:#FFFFFF;
  --border:#DFE7E0;
  --text:#182420;
  --text-muted:#5E6E64;
  --vermelho:#AE4430;
  --sombra: 0 2px 10px rgba(18,48,31,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus:not(:focus-visible){outline:none;box-shadow:none;}
input,select,textarea{font-family:inherit;}
a{color:var(--verde-700);}
::selection{background:var(--verde-300);}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:252px;flex-shrink:0;background:var(--verde-900);color:#fff;
  display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px 6px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:16px;}
.brand-icon{width:34px;height:34px;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:#fff;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--verde-300);margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav button{
  display:flex;align-items:center;gap:11px;background:none;border:none;color:#D9E8DD;
  text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:600;
  transition:background .15s;
}
.nav button svg{width:18px;height:18px;flex-shrink:0;opacity:.9;}
.nav button:hover{background:rgba(255,255,255,0.06);}
.nav button.active{background:var(--verde-700);color:#fff;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,0.12);padding-top:14px;margin-top:10px;}
.admin-pill{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;color:var(--verde-300);
}
.admin-pill button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.account-summary{min-width:0;display:flex;flex-direction:column;gap:3px;}
.account-name{max-width:160px;display:flex;align-items:center;gap:5px;overflow:hidden;color:#fff;font-weight:700;}
.account-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.account-role{color:var(--verde-300);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;}
.topbar .desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.help-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#fff;
  color:var(--verde-700);font-weight:800;font-size:15px;flex-shrink:0;
}
.content{padding:22px 26px 90px 26px;max-width:1180px;width:100%;}

/* Mobile bottom nav */
.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;background:var(--verde-900);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;z-index:30;
  box-shadow:0 -2px 12px rgba(0,0,0,.18);
}
.bottomnav-row{display:flex;justify-content:space-around;}
.bottomnav button{
  background:none;border:none;color:#B9CDC0;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:10.5px;font-weight:700;padding:5px 4px;border-radius:10px;flex:1;
}
.bottomnav button svg{width:20px;height:20px;}
.bottomnav button.active{color:#fff;}
.bottomnav button.active svg{filter:drop-shadow(0 0 6px rgba(143,203,158,.6));}
.section-tabs{display:flex;gap:6px;padding:5px;background:#EAF0EA;border-radius:12px;margin-bottom:14px;}
.section-tabs button{flex:1;min-width:0;border:0;border-radius:9px;background:transparent;color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:700;padding:10px 8px;}
.section-tabs button.active{background:#fff;color:var(--verde-800);box-shadow:var(--sombra);}

/* ---------- CARDS / GENERIC ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--sombra);}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:920px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--verde-800);}
.stat-value.small{font-size:18px;}
.stat-sub{font-size:12px;color:var(--text-muted);}

.section-title{font-size:16px;font-weight:700;margin:26px 0 12px 0;color:var(--verde-900);}
.section-title:first-child{margin-top:0;}

.btn{
  border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;
  display:inline-flex;align-items:center;gap:7px;transition:opacity .15s;
}
.btn:active{opacity:.8;}
.btn-primary{background:var(--verde-700);color:#fff;}
.btn-primary:hover{background:var(--verde-600);}
.btn-outline{background:#fff;border:1.5px solid var(--verde-700);color:var(--verde-700);}
.btn-outline:hover{background:var(--verde-100);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:#fff;border:1.5px solid var(--vermelho);color:var(--vermelho);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
.toolbar-left,.toolbar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.backup-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.drive-backup-actions{grid-template-columns:repeat(3,minmax(0,1fr));}
.drive-backup-actions .btn{min-width:0;padding:8px 6px;font-size:12px;line-height:1.25;white-space:normal;}
.backup-import-btn{cursor:pointer;display:flex;align-items:center;gap:7px;margin:0;}

input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--text);
  background:#fff;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde-300);border-color:var(--verde-500);}
label{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:5px;}
.field{margin-bottom:13px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);
  padding:9px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:12px;}
.table-empty{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}
.dashboard-ranking-mobile{display:none;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:800;}
.badge-green{background:var(--verde-100);color:var(--verde-700);}
.badge-amber{background:#FBF0DC;color:var(--ouro);}
.badge-red{background:#F7E5E0;color:var(--vermelho);}
.badge-grey{background:#EEF1EF;color:var(--text-muted);}

.progress{background:#EAF0EA;border-radius:8px;height:8px;overflow:hidden;}
.progress > div{height:100%;background:var(--verde-500);border-radius:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(18,30,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:720px){.modal-overlay{align-items:center;}}
.modal{background:#fff;border-radius:18px 18px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:22px;}
@media(min-width:720px){.modal{border-radius:16px;}}
.modal-public-details{border-radius:18px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;padding:2px 6px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .icon{width:44px;height:44px;color:var(--verde-300);margin-bottom:10px;}

.podium-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:18px;}
.podium-card{border-radius:14px;padding:16px 10px;text-align:center;color:#fff;}
.podium-1{background:linear-gradient(160deg,#C08A22,#9C6E17);order:2;padding-top:22px;}
.podium-2{background:linear-gradient(160deg,#9AA6AE,#727C82);order:1;}
.podium-3{background:linear-gradient(160deg,#B0703F,#8A5630);order:3;}
.podium-medal{font-size:22px;}
.podium-name{font-weight:800;font-size:13.5px;margin-top:4px;}
.podium-score{font-family:'Fraunces',serif;font-size:20px;margin-top:2px;}
.podium-vazio{background:#EDF1EE !important;color:var(--text-muted) !important;border:1.5px dashed var(--border);}
@media(max-width:600px){.podium-wrap{grid-template-columns:1fr;}
  .podium-1,.podium-2,.podium-3{order:0;padding-top:16px;}}

.filters{display:flex;flex-wrap:wrap;gap:10px;}
.filters > div{min-width:150px;flex:1 1 150px;}
.filters > div.filtro-status{min-width:180px;flex:1 1 180px;}
select{text-overflow:ellipsis;}

.banner{background:var(--verde-100);border:1px solid var(--verde-300);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--verde-800);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
.banner.amber{background:#FBF0DC;border-color:#E9CE94;color:#7A5A0F;}
.banner b{display:block;margin-bottom:2px;}

.sig-row{display:flex;flex-wrap:wrap;gap:10px;}
.sig-chip{flex:1;min-width:150px;border:1.5px solid var(--border);border-radius:10px;padding:9px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
.sig-chip.on{border-color:var(--verde-500);background:var(--verde-100);color:var(--verde-800);}
.sig-chip .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
.sig-chip.on .dot{background:var(--verde-500);border-color:var(--verde-500);}

.loading-screen{position:fixed;inset:0;background:var(--verde-900);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:10px;z-index:999;}
.auth-screen{min-height:100vh;width:100%;display:grid;place-items:center;padding:20px;background:var(--bg);}
.auth-card{width:min(100%,420px);}
.auth-card h1{margin:0 0 8px;color:var(--verde-900);font-size:24px;}
.auth-error{color:var(--vermelho);font-size:13px;margin:10px 0;}
.login-loading-overlay{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(18,48,31,.94);color:#fff;text-align:center;}
.login-loading-spinner{width:44px;height:44px;border:4px solid rgba(143,203,158,.3);border-top-color:#8FCB9E;border-radius:50%;animation:login-spin .8s linear infinite;}
@keyframes login-spin{to{transform:rotate(360deg);}}
@media(prefers-reduced-motion:reduce){.login-loading-spinner{animation-duration:1.8s;}}
.public-ranking-screen{align-items:start;padding:clamp(24px,8vh,72px) 16px;}
.public-ranking-card{width:min(100%,760px);margin:0 auto;padding:20px;}
.public-details-toggle{min-width:92px;min-height:54px;padding:5px 8px;background:transparent;color:var(--text-muted);justify-content:center;overflow:hidden;}
.public-details-toggle:hover{background:rgba(94,110,100,.08);}
.public-details-toggle.is-achieved{background:var(--verde-100);color:var(--verde-700);}
.public-details-toggle.is-achieved:hover{background:var(--verde-300);}
.public-details-window{display:block;width:100%;height:42px;overflow:hidden;}
.public-details-track{display:flex;width:100%;height:400%;flex-direction:column;}
.public-details-toggle.is-achieved .public-details-track{animation:public-details-roll 9s cubic-bezier(.22,.61,.36,1) infinite;}
.public-details-frame{display:flex;flex:0 0 25%;width:100%;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;white-space:nowrap;}
.public-details-frame strong{font-size:12.5px;font-weight:800;}
.public-details-frame small{font-size:10px;font-weight:700;}
@keyframes public-details-roll{
  0%,27%{transform:translateY(0);}
  33.333%,60%{transform:translateY(-25%);}
  66.666%,93.333%{transform:translateY(-50%);}
  100%{transform:translateY(-75%);}
}
@media(prefers-reduced-motion:reduce){
  .public-details-track{animation:none;}
  .public-details-frame:not(:first-child){display:none;}
}
.maintenance-card{text-align:center;padding:clamp(24px,6vw,44px);}
.maintenance-illustration{width:min(100%,250px);margin:0 auto 12px;}
.maintenance-illustration img{display:block;width:100%;height:auto;}
.maintenance-badge{display:block;width:max-content;margin:0 auto 20px;}
.maintenance-title{margin:0 0 8px;color:var(--verde-900);}
.maintenance-message{max-width:440px;margin:0 auto 20px;color:var(--text-muted);line-height:1.6;}
.public-ranking-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end;}
.public-ranking-filters .field{min-width:0;margin-bottom:10px;}
.public-ranking-table{width:100%;margin:0 auto;}
.material-detail-table{width:100%;table-layout:fixed;}
.material-detail-table th{white-space:normal;}
.material-detail-table th:nth-child(1){width:28%;}
.material-detail-table th:nth-child(2){width:25%;}
.material-detail-table th:nth-child(3){width:21%;}
.material-detail-table th:nth-child(4){width:26%;}
.material-amount{display:flex;min-height:24px;align-items:center;justify-content:center;gap:3px;white-space:nowrap;}
.material-quantity{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap;font-size:11.5px;font-weight:400;}
.material-detail-table td:nth-child(4){font-size:11.5px;}
.material-balance-marker{display:inline-flex;width:24px;height:14px;flex:0 0 24px;align-items:center;justify-content:center;align-self:flex-start;margin-top:1px;padding:0;border-radius:20px;font-size:8px;font-weight:800;line-height:1;white-space:nowrap;}
.badge-surplus{padding:2px 5px;font-size:10px;white-space:nowrap;}
.badge-carryover{background:#FFF1E5;color:#B45309;padding:2px 5px;font-size:10px;white-space:nowrap;}
.material-balance-legend{display:flex;justify-content:flex-start;gap:14px;flex-wrap:wrap;margin-top:8px;}
.material-balance-legend-item{display:inline-flex;align-items:center;gap:5px;}
.material-balance-swatch{display:inline-block;width:30px;height:15px;border-radius:20px;}
.material-balance-swatch.previous{background:#FFF1E5;}
.material-balance-swatch.next{background:var(--verde-100);}
#tcInfoKits{align-items:flex-start;}
#tcInfoKits>div{min-width:0;overflow-wrap:anywhere;}
#tcInfoKits b{display:inline;margin-bottom:0;}
@media(max-width:600px){
  .public-ranking-screen{padding:20px 10px;}
  .public-ranking-card{padding:14px;width:100%;}
  .public-ranking-filters{grid-template-columns:1fr;gap:0;}
  .public-ranking-card .table-wrap{width:100%;max-width:100%;margin-inline:auto;}
  .podium-card{height:116px;box-sizing:border-box;}
  .podium-1{height:130px;}
  .material-detail-table{font-size:11px;}
  .material-detail-table th{font-size:9px;letter-spacing:0;padding:7px 3px;}
  .material-detail-table td{padding:8px 3px;overflow-wrap:anywhere;}
  .badge-surplus{font-size:9px;padding:2px 4px;}
  .modal-overlay-public-details{align-items:center;padding:10px;}
  .modal-public-details{padding:16px 12px calc(16px + env(safe-area-inset-bottom));border-radius:18px;}
}

.checklist{font-size:13.5px;line-height:1.9;padding-left:20px;color:var(--text);}
.checklist li{margin-bottom:4px;}

.small-note{font-size:12px;color:var(--text-muted);}

.tag-input-btn{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--border);border-radius:10px;padding:12px;color:var(--text-muted);font-size:13px;font-weight:700;}

@media(max-width:920px){
  .sidebar{display:none;}
  .content{padding:16px 14px 96px 14px;}
  .topbar{padding:12px 14px;align-items:flex-start;}
  .topbar > div:last-child{gap:6px !important;}
  .topbar select{min-width:0 !important;max-width:min(52vw,260px);}
  .bottomnav{display:block;}
  .bottomnav-row{max-width:520px;margin:0 auto;}
  .bottomnav button{min-width:0;min-height:48px;padding:5px 2px;}
  .content{padding-bottom:calc(86px + env(safe-area-inset-bottom));}
  .table-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
  .toolbar{align-items:stretch;}
  .toolbar-left,.toolbar-right{width:100%;}
  .toolbar-right > .btn{flex:1 1 auto;justify-content:center;}
}
@media(max-width:600px){
  .topbar{gap:8px;}
  .topbar h1{font-size:17px;}
  .topbar .desc{font-size:11.5px;}
  .topbar > div:last-child{max-width:58%;justify-content:flex-end;}
  .topbar > div:last-child > div{min-width:0;max-width:calc(100% - 40px);}
  .topbar > div:last-child .small-note{display:none;}
  .topbar select{max-width:100%;font-size:12px;padding:8px 7px;}
  .help-btn{width:32px;height:32px;}
  .content{padding:14px 10px calc(82px + env(safe-area-inset-bottom));}
  .card{padding:14px;border-radius:12px;}
  .grid{gap:9px;}
  .grid-4,.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}
  .stat-value{font-size:23px;}
  .toolbar-left,.toolbar-right{gap:7px;}
  .toolbar-right > .btn{flex-basis:100%;}
  .btn{min-height:42px;padding:10px 12px;}
  .filters > div,.filters > div.filtro-status{min-width:0;flex:1 1 130px;}
  .podium-wrap{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .podium-card{padding:12px 5px;}
  .podium-1{padding-top:15px;}
  .podium-name{font-size:11px;overflow-wrap:anywhere;}
  .podium-score{font-size:17px;}
  .bottomnav button{font-size:9.5px;}
  .bottomnav button svg{width:19px;height:19px;}
  .section-tabs button{font-size:12px;padding:10px 5px;}
  .dashboard-ranking-table{display:none;}
  .dashboard-ranking-mobile{display:grid;gap:8px;}
  .dashboard-ranking-mobile-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;padding:11px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;}

/* =========================================================
   RECICLAR É CUIDAR DA CASA COMUM — APAC IMPERATRIZ
   Aplicativo de ranking de arrecadação de recicláveis
   ========================================================= */

/* ---------- CONSTANTES DO REGULAMENTO ---------- */
const CATEGORIAS = [
  { key:'latinhas',  label:'Latinhas (refrigerante, cerveja, energético)', metaDefault:150, unidade:'Un.', aceitaKg:true, unidadesPorKg:75 },
  { key:'pet',       label:'Garrafas PET',                                  metaDefault:250, unidade:'Un.' },
  { key:'embalagens',label:'Embalagens plásticas (arroz, açúcar, leite, sal, fardos)', metaDefault:100, unidade:'Un.' },
  { key:'papelao',   label:'Caixas de papelão',                             metaDefault:100, unidade:'Un.' },
  { key:'latas',     label:'Latas em geral (sardinha, leite, kitut, feijoada)', metaDefault:80, unidade:'Un.' },
  { key:'ovos',      label:'Cartelas de ovos (30 unidades)',                metaDefault:25,  unidade:'Un.' },
];
const TIPO_OUTROS = 'outros';
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATEGORIA_MAP = Object.fromEntries(CATEGORIAS.map(c=>[c.key,c]));
/* Cada campanha pode personalizar o nome exibido das seis categorias oficiais do
   regulamento (a chave interna nunca muda, só o rótulo) e também cadastrar materiais
   extras próprios, com sua própria meta. categoriasDaCampanha() devolve a lista completa
   (oficiais + extras) que o cálculo de pontuação, os formulários e os relatórios usam. */
function categoriasDaCampanha(campanha){
  const desativadas = (campanha && campanha.categoriasDesativadas) || [];
  const oficiais = CATEGORIAS
    .filter(cat => !desativadas.includes(cat.key))
    .map(cat => ({
      ...cat,
      label: (campanha && campanha.nomesPersonalizados && campanha.nomesPersonalizados[cat.key]) || cat.label,
    }));
  const extras = (campanha && campanha.materiaisExtras) || [];
  return [...oficiais, ...extras];
}
// Igual à anterior, mas sem excluir materiais desativados — usada só para exibir o nome de
// um material em registros já existentes (tabelas, CSV), nunca para calcular pontuação.
function todasCategoriasDaCampanha(campanha){
  const oficiais = CATEGORIAS.map(cat => ({
    ...cat,
    label: (campanha && campanha.nomesPersonalizados && campanha.nomesPersonalizados[cat.key]) || cat.label,
  }));
  const extras = (campanha && campanha.materiaisExtras) || [];
  return [...oficiais, ...extras];
}
function resolverCategoria(campanhaId, tipoKey){
  const campanha = campanhaPorId(campanhaId);
  return todasCategoriasDaCampanha(campanha).find(cat => cat.key === tipoKey) || null;
}

/* ---------- ESTADO ---------- */
let STATE = {

  histMes: null, histAno: null,
};
/* ---------- HELPERS DE ARMAZENAMENTO ---------- */
/* A configuração Firebase é pública; o controle de acesso efetivo fica nas regras
   do Firestore e nos papéis de usuário registrados no banco. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDMpYOJrypaiE05HUoHNERSZTBhwj2Vouo",

  projectId: "apac-reciclar",
  storageBucket: "apac-reciclar.firebasestorage.app",

  appId: "1:309128467158:web:a3a1c14fed86b00020ef77"
};
const GOOGLE_DRIVE_CLIENT_ID = '309128467158-kgldnn0k6n88crj1ca17phlguranao7c.apps.googleusercontent.com';
const GOOGLE_DRIVE_LINK_COLLECTION = 'reciclar-apac-drive-links';
const GOOGLE_DRIVE_BACKUP_FOLDER_NAME = 'Reciclar APAC Backups';
const GOOGLE_DRIVE_BACKUP_LIMIT = 10;
const GOOGLE_DRIVE_API_BASE = 'https://www.googleapis.com/drive/v3';
const GOOGLE_DRIVE_SCOPE = 'openid email profile https://www.googleapis.com/auth/drive.file';

let FIREBASE_DB = null;
let FIREBASE_AUTH = null;
let STORAGE_MODE = 'none';
const FIRESTORE_RECORD_COLLECTIONS = new Set(['colaboradores','entregas','transferencias','trocas','campanhas','metas','lixeira']);
const FIRESTORE_MIGRATION_COLLECTIONS = new Set(['colaboradores','entregas','transferencias','trocas','campanhas','metas']);
const COLECOES_RESTAURAVEIS = new Set(['colaboradores','entregas','transferencias','trocas','campanhas']);
const PRAZO_LIXEIRA_MS = 30*24*60*60*1000;
const FIRESTORE_BASELINES = new Map();
const STORAGE_ERRORS = new Map();
const PUBLIC_RANKING_SOURCE_KEYS = new Set(['colaboradores','entregas','transferencias','trocas','campanhas','metas']);
let rankingPublicoSyncAtivo = false;
let rankingPublicoSyncTimer = null;
let rankingPublicoSyncMesTimer = null;
let rankingPublicoSyncPromise = null;
let rankingPublicoSyncPendente = false;
let rankingPublicoUltimoMesSincronizado = '';
let rankingsPublicosUnsubscribe = null;
let manutencaoPublicaUnsubscribe = null;
function serializarEstavel(valor){
  if(Array.isArray(valor)) return `[${valor.map(serializarEstavel).join(',')}]`;
  if(valor && typeof valor==='object'){
    return `{${Object.keys(valor).sort().map(chave=>`${JSON.stringify(chave)}:${serializarEstavel(valor[chave])}`).join(',')}}`;
  }
  return JSON.stringify(valor);
}

function inicializarFirebase(config){
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    FIREBASE_DB = firebase.firestore();
    FIREBASE_AUTH = firebase.auth();
    return true;
  }catch(e){ console.error('Erro ao iniciar Firebase', e); return false; }
}
async function detectarModoArmazenamento(){
  if(window.storage){ STORAGE_MODE='claude'; return; }
  if(FIREBASE_CONFIG && typeof firebase!=='undefined' && inicializarFirebase(FIREBASE_CONFIG)){ STORAGE_MODE='firestore'; return; }
  STORAGE_MODE='local';
}
async function storageGet(key, fallback){
  try{
    if(STORAGE_MODE==='claude'){
      const r = await window.storage.get(key, true);
      return r && r.value !== undefined ? JSON.parse(r.value) : fallback;
    }
    if(STORAGE_MODE==='firestore'){
      if(FIRESTORE_RECORD_COLLECTIONS.has(key)){
        const records = await FIREBASE_DB.collection('reciclar-apac').doc(key).collection('records').get();
        if(!records.empty){
          const baseline = new Map();
          const valores = records.docs.map(doc=>{
            const valor = doc.data();
            baseline.set(doc.id, serializarEstavel(valor));
            return valor;
          });
          FIRESTORE_BASELINES.set(key, baseline);
          return valores;
        }
        FIRESTORE_BASELINES.set(key, new Map());
        const marcador=await FIREBASE_DB.collection('reciclar-apac-migrations').doc(key).get();
        if(marcador.exists && marcador.data().schemaVersion===1) return [];
      }
      const doc = await FIREBASE_DB.collection('reciclar-apac').doc(key).get();
      return doc.exists && doc.data().value !== undefined ? JSON.parse(doc.data().value) : fallback;
    }
    const raw = localStorage.getItem('reciclar-apac:'+key);
    return raw!==null ? JSON.parse(raw) : fallback;
  }catch(e){
    console.error('Erro ao carregar', key, e);
    if(STORAGE_MODE==='firestore') throw new Error(`Não foi possível carregar "${key}" no Firestore. Verifique as regras e tente novamente.`);
    return fallback;
  }
}
async function storageSet(key, value){
  try{
    if(STORAGE_MODE==='claude'){ await window.storage.set(key, JSON.stringify(value), true); STORAGE_ERRORS.delete(key); return true; }
    if(STORAGE_MODE==='firestore'){
      if(!FIRESTORE_RECORD_COLLECTIONS.has(key)){
        await FIREBASE_DB.collection('reciclar-apac').doc(key).set({value: JSON.stringify(value)});
        agendarSincronizacaoRankingsPublicos(key);
        STORAGE_ERRORS.delete(key);
        return true;
      }
      if(!Array.isArray(value)) throw new Error(`A coleção "${key}" precisa ser uma lista.`);
      const base = FIRESTORE_BASELINES.get(key) || new Map();
      const referencia = FIREBASE_DB.collection('reciclar-apac').doc(key).collection('records');
      const atuais = await referencia.get();
      const remotos = new Map(atuais.docs.map(doc=>[doc.id, serializarEstavel(doc.data())]));
      const alterados = [];
      const ids = new Set();
      for(const registro of value){
        if(!registro || typeof registro.id!=='string' || !registro.id.trim() || ids.has(registro.id)){
          throw new Error(`Registro inválido ou ID duplicado na coleção "${key}".`);
        }
        ids.add(registro.id);
        const serializado = serializarEstavel(registro);
        const original = base.get(registro.id);
        const remoto = remotos.get(registro.id);
        if(original===serializado || remoto===serializado) continue;
        if((original===undefined && remoto!==undefined) || (original!==undefined && remoto!==original)){
          throw new Error(`O registro "${registro.id}" foi alterado por outra pessoa. Atualize a página antes de salvar.`);
        }
        alterados.push({id:registro.id, registro, serializado});
      }
      for(let inicio=0;inicio<alterados.length;inicio+=450){
        const parte = alterados.slice(inicio,inicio+450);
        const lote = FIREBASE_DB.batch();
        parte.forEach(item=>lote.set(referencia.doc(item.id), item.registro));
        await lote.commit();
        parte.forEach(item=>{
          base.set(item.id,item.serializado);
          remotos.set(item.id,item.serializado);
        });
      }
      FIRESTORE_BASELINES.set(key,base);
      agendarSincronizacaoRankingsPublicos(key);
      STORAGE_ERRORS.delete(key);
      return true;
    }
    localStorage.setItem('reciclar-apac:'+key, JSON.stringify(value));
    STORAGE_ERRORS.delete(key);
    return true;
  }catch(e){
    console.error('Erro ao salvar', key, e);
    STORAGE_ERRORS.set(key,e);
    return false;
  }
}
async function storageDeleteRecord(key,id){
  if(STORAGE_MODE!=='firestore') return true;
  try{
    if(!FIRESTORE_RECORD_COLLECTIONS.has(key)) throw new Error(`A coleção "${key}" não permite excluir registros individuais.`);
    const baseline=FIRESTORE_BASELINES.get(key)||new Map();
    const original=baseline.get(id);
    if(original===undefined) throw new Error(`O registro "${id}" não está na versão carregada. Atualize a página antes de excluir.`);
    const referencia=FIREBASE_DB.collection('reciclar-apac').doc(key).collection('records').doc(id);
    const atual=await referencia.get();
    if(!atual.exists || serializarEstavel(atual.data())!==original){
      throw new Error(`O registro "${id}" foi alterado por outra pessoa. Atualize a página antes de excluir.`);
    }
    await referencia.delete();
    baseline.delete(id);
    FIRESTORE_BASELINES.set(key,baseline);
    agendarSincronizacaoRankingsPublicos(key);
    return true;
  }catch(e){
    console.error('Erro ao excluir registro',key,id,e);
    return false;
  }
}
async function moverRegistroParaLixeira(colecao,id){
  if(!STATE.isAdmin || !COLECOES_RESTAURAVEIS.has(colecao)) return false;
  const registros=STATE[colecao];
  const registro=registros.find(item=>item.id===id);
  if(!registro) return false;
  const registroLixeira={
    id:uid(),
    colecao,
    registroId:id,
    registro:JSON.parse(JSON.stringify(registro)),
    excluidoEm:new Date().toISOString(),
    excluidoPor:STATE.authUser?STATE.authUser.uid:'',
  };
  try{
    if(STORAGE_MODE==='firestore'){
      const referencia=FIREBASE_DB.collection('reciclar-apac').doc(colecao).collection('records');
      const lixeiraReferencia=FIREBASE_DB.collection('reciclar-apac').doc('lixeira').collection('records');
      const serializadoOriginal=(FIRESTORE_BASELINES.get(colecao)||new Map()).get(id);
      if(serializadoOriginal===undefined) throw new Error('O registro não está na versão carregada. Atualize a página antes de excluir.');
      if(serializarEstavel(registro)!==serializadoOriginal) throw new Error('O registro foi alterado localmente. Atualize a página antes de excluir.');
      await FIREBASE_DB.runTransaction(async transacao=>{
        const snapshot=await transacao.get(referencia.doc(id));
        if(!snapshot.exists || serializarEstavel(snapshot.data())!==serializadoOriginal){
          throw new Error('O registro foi alterado por outra pessoa. Atualize a página antes de excluir.');
        }
        transacao.set(lixeiraReferencia.doc(registroLixeira.id),registroLixeira);
        transacao.delete(referencia.doc(id));
      });
      const baseColecao=FIRESTORE_BASELINES.get(colecao)||new Map();
      baseColecao.delete(id);
      FIRESTORE_BASELINES.set(colecao,baseColecao);
      const baseLixeira=FIRESTORE_BASELINES.get('lixeira')||new Map();
      baseLixeira.set(registroLixeira.id,serializarEstavel(registroLixeira));
      FIRESTORE_BASELINES.set('lixeira',baseLixeira);
    }else{
      const lixeiraNova=[...STATE.lixeira,registroLixeira];
      const registrosNovos=registros.filter(item=>item.id!==id);
      if(!await storageSet('lixeira',lixeiraNova)) return false;
      if(!await storageSet(colecao,registrosNovos)){
        if(!await storageSet('lixeira',STATE.lixeira)) console.error('Não foi possível desfazer o arquivamento após falha ao excluir',registroLixeira.id);
        return false;
      }
    }
    STATE.lixeira=[...STATE.lixeira,registroLixeira];
    STATE[colecao]=registros.filter(item=>item.id!==id);
    agendarSincronizacaoRankingsPublicos(colecao);
    return true;
  }catch(erro){
    console.error('Erro ao mover registro para a lixeira',colecao,id,erro);
    return false;
  }
}
async function restaurarRegistroLixeira(id){
  if(!exigirAdmin()) return;
  const registroLixeira=STATE.lixeira.find(item=>item.id===id);
  if(!registroLixeira || !COLECOES_RESTAURAVEIS.has(registroLixeira.colecao)
    || !registroLixeira.registro || registroLixeira.registro.id!==registroLixeira.registroId){
    alert('Este item da lixeira não pode ser restaurado. Atualize a página.');
    return;
  }
  const excluidoEm=Date.parse(registroLixeira.excluidoEm);
  if(!Number.isFinite(excluidoEm) || Date.now()-excluidoEm>=PRAZO_LIXEIRA_MS){
    await limparLixeiraExpirada();
    alert('O prazo de restauração de 30 dias deste item expirou.');
    renderApp();
    return;
  }
  const colecao=registroLixeira.colecao;
  const registros=STATE[colecao];
  if(registros.some(item=>item.id===registroLixeira.registroId)){
    alert('Já existe um registro com este identificador. O item não foi restaurado.');
    return;
  }
  try{
    if(STORAGE_MODE==='firestore'){
      const referencia=FIREBASE_DB.collection('reciclar-apac').doc(colecao).collection('records');
      const lixeiraReferencia=FIREBASE_DB.collection('reciclar-apac').doc('lixeira').collection('records');
      await FIREBASE_DB.runTransaction(async transacao=>{
        const [origem,alvo]=await Promise.all([
          transacao.get(lixeiraReferencia.doc(id)),
          transacao.get(referencia.doc(registroLixeira.registroId)),
        ]);
        if(!origem.exists || serializarEstavel(origem.data())!==serializarEstavel(registroLixeira)){
          throw new Error('O item da lixeira foi alterado. Atualize a página antes de restaurar.');
        }
        if(alvo.exists) throw new Error('Já existe um registro com este identificador.');
        transacao.set(referencia.doc(registroLixeira.registroId),registroLixeira.registro);
        transacao.delete(lixeiraReferencia.doc(id));
      });
      const baseColecao=FIRESTORE_BASELINES.get(colecao)||new Map();
      baseColecao.set(registroLixeira.registroId,serializarEstavel(registroLixeira.registro));
      FIRESTORE_BASELINES.set(colecao,baseColecao);
      const baseLixeira=FIRESTORE_BASELINES.get('lixeira')||new Map();
      baseLixeira.delete(id);
      FIRESTORE_BASELINES.set('lixeira',baseLixeira);
    }else{
      const lixeiraAnterior=STATE.lixeira;
      STATE[colecao]=[...registros,registroLixeira.registro];
      if(!await storageSet(colecao,STATE[colecao])){
        STATE[colecao]=registros;
        throw new Error('Não foi possível gravar o registro restaurado.');
      }
      STATE.lixeira=lixeiraAnterior.filter(item=>item.id!==id);
      if(!await storageSet('lixeira',STATE.lixeira)){
        STATE.lixeira=lixeiraAnterior;
        STATE[colecao]=registros;
        const rollback=await storageSet(colecao,registros);
        if(!rollback) console.error('Não foi possível desfazer uma restauração parcial',id);
        throw new Error('Não foi possível remover o item da lixeira após restaurá-lo.');
      }
    }
    STATE[colecao]=[...registros,registroLixeira.registro];
    STATE.lixeira=STATE.lixeira.filter(item=>item.id!==id);
    agendarSincronizacaoRankingsPublicos(colecao);
    renderApp();
  }catch(erro){
    console.error('Erro ao restaurar registro da lixeira',id,erro);
    alert(erro.message||'Não foi possível restaurar este item. Atualize a página e tente novamente.');
  }
}
window.restaurarRegistroLixeira=restaurarRegistroLixeira;
async function excluirDefinitivamenteLixeira(id){
  if(!exigirAdmin()) return;
  const item=STATE.lixeira.find(registro=>registro.id===id);
  if(!item) return;
  if(!confirm(`Excluir definitivamente "${resumoItemLixeira(item)}"? Esta ação não pode ser desfeita.`)) return;
  try{
    if(STORAGE_MODE==='firestore'){
      const baseline=FIRESTORE_BASELINES.get('lixeira')||new Map();
      const original=baseline.get(id);
      if(original===undefined) throw new Error('O item não está na versão carregada. Atualize a página antes de excluir.');
      const referencia=FIREBASE_DB.collection('reciclar-apac').doc('lixeira').collection('records').doc(id);
      await FIREBASE_DB.runTransaction(async transacao=>{
        const snapshot=await transacao.get(referencia);
        if(!snapshot.exists || serializarEstavel(snapshot.data())!==original){
          throw new Error('O item foi alterado por outra pessoa. Atualize a página antes de excluir.');
        }
        transacao.delete(referencia);
      });
      baseline.delete(id);
      FIRESTORE_BASELINES.set('lixeira',baseline);
    }else{
      const lixeiraAtualizada=STATE.lixeira.filter(registro=>registro.id!==id);
      if(!await storageSet('lixeira',lixeiraAtualizada)){
        throw STORAGE_ERRORS.get('lixeira')||new Error('Não foi possível excluir definitivamente o item.');
      }
    }
    STATE.lixeira=STATE.lixeira.filter(registro=>registro.id!==id);
    renderApp();
  }catch(erro){
    console.error('Erro ao excluir definitivamente item da lixeira',id,erro);
    alert(erro.message||'Não foi possível excluir definitivamente o item. Atualize a página e tente novamente.');
  }
}
window.excluirDefinitivamenteLixeira=excluirDefinitivamenteLixeira;
async function limparLixeiraExpirada(){
  if(!STATE.isAdmin || !Array.isArray(STATE.lixeira)) return;
  const limite=Date.now()-PRAZO_LIXEIRA_MS;
  const expirados=STATE.lixeira.filter(item=>{
    const data=Date.parse(item.excluidoEm);
    return Number.isFinite(data) && data<=limite;
  });
  if(!expirados.length) return;
  if(STORAGE_MODE==='firestore'){
    for(const item of expirados){
      if(!await storageDeleteRecord('lixeira',item.id)){
        console.error('Não foi possível remover um item expirado da lixeira',item.id);
        return;
      }
      STATE.lixeira=STATE.lixeira.filter(atual=>atual.id!==item.id);
    }
  }else{
    const idsExpirados=new Set(expirados.map(item=>item.id));
    STATE.lixeira=STATE.lixeira.filter(item=>!idsExpirados.has(item.id));
    if(!await storageSet('lixeira',STATE.lixeira)){
      STATE.lixeira=[...STATE.lixeira,...expirados];
      console.error('Não foi possível remover itens expirados da lixeira');
    }
  }
}
async function storageReplaceCollection(key,records){
  if(STORAGE_MODE!=='firestore') return storageSet(key,records);
  if(!FIRESTORE_RECORD_COLLECTIONS.has(key) || !Array.isArray(records)) return false;
  const atuais=await storageGet(key,[]);
  const manter=new Set(records.map(registro=>registro.id));
  for(const registro of atuais){
    if(!manter.has(registro.id) && !await storageDeleteRecord(key,registro.id)) return false;
  }
  return storageSet(key,records);
}
function firestoreCollectionMatches(records, snapshot){
  if(snapshot.size!==records.length) return false;
  const documents=new Map(snapshot.docs.map(doc=>[doc.id,doc]));
  return records.every(record=>{
    if(!record || typeof record.id!=='string') return false;
    const doc=documents.get(record.id);
    return !!doc && serializarEstavel(doc.data())===serializarEstavel(record);
  });
}
async function migrarColecoesFirestoreLegadas(){
  const base=FIREBASE_DB.collection('reciclar-apac');
  for(const key of FIRESTORE_MIGRATION_COLLECTIONS){
    const marcadorRef=FIREBASE_DB.collection('reciclar-apac-migrations').doc(key);
    const marcador=await marcadorRef.get();
    if(marcador.exists && marcador.data().schemaVersion===1) continue;
    const legado=await base.doc(key).get();
    if(legado.exists && legado.data().value!==undefined){
      let registros;
      try { registros=JSON.parse(legado.data().value); }
      catch(e){ throw new Error(`Os dados antigos de "${key}" não são um JSON válido.`); }
      if(!Array.isArray(registros)) throw new Error(`Os dados antigos de "${key}" não têm o formato esperado.`);
      if(!await storageSet(key,registros)) throw new Error(`Não foi possível migrar a coleção "${key}".`);
      const atuais=await base.doc(key).collection('records').get();
      if(!firestoreCollectionMatches(registros,atuais)){
        throw new Error(`A conferência da migração de "${key}" encontrou diferenças. Os dados antigos foram preservados; peça ao administrador para revisar a coleção no Firestore.`);
      }
    }
    await marcadorRef.set({schemaVersion:1});
  }
  const docConfig=await base.doc('config').get();
  if(docConfig.exists && docConfig.data().value!==undefined){
    let config;
    try { config=JSON.parse(docConfig.data().value); }
    catch(e){ throw new Error('As configurações antigas não são um JSON válido.'); }
    if(config && Object.prototype.hasOwnProperty.call(config,'senhaAdmin')){
      delete config.senhaAdmin;
      if(!await storageSet('config',config)) throw new Error('Não foi possível remover a senha antiga das configurações do Firebase.');
    }
  }
}

    const marcador=await FIREBASE_DB.collection('reciclar-apac-migrations').doc(key).get();
    if(marcador.exists && marcador.data().schemaVersion===1) continue;
    const legado=await base.doc(key).get();

/* ---------- CAMPANHAS ----------
   Cada campanha é uma entidade independente e explícita: toda entrega e toda
   transferência guardam o campo campanhaId dizendo a qual campanha pertencem.
   A data do registro NUNCA decide a campanha — duas campanhas podem ter
   períodos sobrepostos, ou até entregas na mesma data, sem nenhum conflito.
   Cada campanha tem suas próprias metas (com histórico mês a mês) e seu
   próprio acúmulo de excedente, isolado das demais. */
const CAMPANHA_LEGADO_INICIO = { mes: 5, ano: 2026 }; // usado só na migração da 1ª vez
async function salvarTrocas(){ await storageSet('trocas', STATE.trocas); }

/* Quantos kits um colaborador já pode trocar agora, dado o saldo atual dele em cada
   material do kit. É o menor resultado entre (saldo do material ÷ quantidade exigida),
   arredondado para baixo — precisa fechar a quantidade em TODOS os materiais do kit. */
function kitsDisponiveis(campanha, totaisPorCategoria){
  const cfg = campanha && campanha.trocaCartela;
  if(!cfg || !cfg.ativo || !cfg.kit) return 0;
  const chaves = Object.keys(cfg.kit).filter(k=>cfg.kit[k]>0);
  if(chaves.length===0) return 0;
  return Math.floor(Math.min(...chaves.map(k => (totaisPorCategoria[k]||0) / cfg.kit[k])));
}
const CAMPANHA_LEGADO_ID = 'campanha-legado-reciclar-2026'; // id estável — nunca gerado de novo a cada migração
function campanhasOrdenadas(){
  return [...STATE.campanhas].sort((a,b)=> (a.anoInicio*12+a.mesInicio) - (b.anoInicio*12+b.mesInicio));
}
function campanhaPorId(id){ return STATE.campanhas.find(c=>c.id===id) || null; }
function campanhaAtiva(){
  const ordenadas = campanhasOrdenadas();
  const ativas = ordenadas.filter(c=>c.status==='ativa');
  if(ativas.length) return ativas[ativas.length-1];
  return ordenadas.length? ordenadas[ordenadas.length-1] : null;
}

function campanhaTemEntregas(campanhaId){

    || STATE.trocas.some(t=>t.campanhaId===campanhaId)
    || STATE.metasSnapshots.some(meta=>meta.campanhaId===campanhaId);
}
async function salvarCampanhas(){ return storageSet('campanhas', STATE.campanhas); }
async function migrarParaCampanhas(configAntigo){
  // Idempotente: nunca substitui a lista de campanhas já existente, nunca gera um id novo
  // para a campanha histórica, e só toca em entregas/transferências que ainda não têm
  // campanhaId. Rodar esta função mais de uma vez não deve mudar nada que já esteja migrado.
  let campanhas = Array.isArray(STATE.campanhas) && STATE.campanhas.length ? [...STATE.campanhas] : [];
  let campanhaLegado = campanhas.find(c => c.id === CAMPANHA_LEGADO_ID)
    || campanhas.find(c => c.nome === 'Reciclar é Cuidar da Casa Comum'); // reconhece a legada mesmo se já existir com outro id
  if(!campanhaLegado){
    const metasDefault = (configAntigo && configAntigo.metasDefault) || Object.fromEntries(CATEGORIAS.map(c=>[c.key,c.metaDefault]));
    const metasHistorico = (configAntigo && configAntigo.metasHistorico) || {};
    campanhaLegado = {
      id: CAMPANHA_LEGADO_ID,
      nome: 'Reciclar é Cuidar da Casa Comum',
      mesInicio: CAMPANHA_LEGADO_INICIO.mes, anoInicio: CAMPANHA_LEGADO_INICIO.ano,
      mesFim: null, anoFim: null,
      status: 'ativa',
      metasDefault, metasHistorico,
    };
    campanhas.push(campanhaLegado);
  }
  STATE.campanhas = campanhas;
  await salvarCampanhas();
  // registros já existentes (entregas e transferências anteriores a esta versão) que ainda não
  // têm campanhaId são associados à campanha legada; registros que já têm campanhaId — de
  // qualquer campanha — nunca são alterados.
  let mudouEntregas=false, mudouTransf=false;
  STATE.entregas.forEach(e=>{ if(!e.campanhaId){ e.campanhaId = campanhaLegado.id; mudouEntregas=true; } });
  STATE.transferencias.forEach(t=>{ if(!t.campanhaId){ t.campanhaId = campanhaLegado.id; mudouTransf=true; } });
  if(mudouEntregas) await salvarEntregas();
  if(mudouTransf) await salvarTransferencias();
  return campanhaLegado;
}

async function carregarDados(){
  STATE.colaboradores = await storageGet('colaboradores', []);
  STATE.entregas = await storageGet('entregas', []);
  STATE.transferencias = await storageGet('transferencias', []);
  STATE.trocas = await storageGet('trocas', []);
  STATE.lixeira = STATE.isAdmin ? await storageGet('lixeira', []) : [];
  await limparLixeiraExpirada();
  STATE.metasSnapshots = await storageGet('metas', []);
  STATE.config = await storageGet('config', null);
  const configAntigoParaMigrar = STATE.config; // pode conter metasDefault/metasHistorico do formato anterior
  if(STATE.config) delete STATE.config.senhaAdmin;
  if(!STATE.config){
    STATE.config = defaultConfig();
    await storageSet('config', STATE.config);
  }
  if(!STATE.config.painelPeriodo) STATE.config.painelPeriodo = { ano: null, tipo: '6' };
  STATE.campanhas = await storageGet('campanhas', null);
  if(!STATE.campanhas || STATE.campanhas.length===0){
    await migrarParaCampanhas(configAntigoParaMigrar);
  } else {
    // Correção de auto-cura: entregas ou transferências criadas por uma versão intermediária
    // do app (sem o campo campanhaId ainda implementado) ficariam invisíveis para sempre, já
    // que a migração só roda quando a coleção de campanhas ainda não existe. Aqui, toda vez
    // que o app carrega, qualquer registro sem campanhaId é associado à campanha legada,
    // sem tocar em nenhum registro que já tenha uma campanha definida.
    const legado = campanhaPorId(CAMPANHA_LEGADO_ID)
      || STATE.campanhas.find(c => c.nome === 'Reciclar é Cuidar da Casa Comum')
      || campanhaAtiva();
    if(legado){
      let mudouEntregas=false, mudouTransf=false;
      STATE.entregas.forEach(e=>{ if(!e.campanhaId){ e.campanhaId = legado.id; mudouEntregas=true; } });
      STATE.transferencias.forEach(t=>{ if(!t.campanhaId){ t.campanhaId = legado.id; mudouTransf=true; } });
      if(mudouEntregas) await salvarEntregas();
      if(mudouTransf) await salvarTransferencias();
    }
  }
  selecionarCampanhaPadraoSeNecessario();
  const {mes,ano} = mesAnoAtual();
  STATE.dashMes=mes; STATE.dashAno=ano;
  STATE.rankMes=mes; STATE.rankAno=ano;
  STATE.histMes=mes; STATE.histAno=ano;
}

/* A campanha nunca é escolhida pela data — mas, depois de escolhida, a data do
   registro precisa estar dentro do período daquela campanha específica. */
function dataDentroDaCampanha(campanhaId, dataISO){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha || !dataISO) return { ok:false, motivo:'Selecione uma campanha válida.' };
  const mes = +dataISO.slice(5,7), ano = +dataISO.slice(0,4);
  const alvo = ano*12+mes;
  const inicio = campanha.anoInicio*12+campanha.mesInicio;
  const fim = campanha.anoFim? (campanha.anoFim*12+campanha.mesFim) : Infinity;
  if(alvo<inicio){
    return { ok:false, motivo:`Essa data é anterior ao início da campanha "${campanha.nome}" (${nomeMes(campanha.mesInicio)}/${campanha.anoInicio}).` };
  }
  if(alvo>fim){
    return { ok:false, motivo:`Essa data é posterior ao encerramento da campanha "${campanha.nome}" (${nomeMes(campanha.mesFim)}/${campanha.anoFim}).` };
  }
  return { ok:true };
}

/* ---------- LÓGICA DE NEGÓCIO ---------- */
function normalizarQuantidadeUnidades(entrega){
  if(entrega.tipo==='latinhas'){
    const cat = CATEGORIA_MAP.latinhas;
    if(entrega.unidade==='kg') return entrega.quantidade * cat.unidadesPorKg;
    if(entrega.unidade==='kg-x10') return (entrega.quantidade/10) * cat.unidadesPorKg;
    return entrega.quantidade;
  }
  return entrega.quantidade;
}
function getMetasDoMes(campanhaId, mes, ano){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return Object.fromEntries(CATEGORIAS.map(c=>[c.key,c.metaDefault]));
  const chave = chaveMA(mes,ano);
  const snapshot = STATE.metasSnapshots.find(m=>m.campanhaId===campanhaId && m.chave===chave);
  if(snapshot) return snapshot.metas;
  if(campanha.metasHistorico[chave]) return campanha.metasHistorico[chave];
  return campanha.metasDefault;
}
async function garantirSnapshotMetas(campanhaId, mes, ano){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return;
  const chave = chaveMA(mes,ano);
  if(campanha.metasHistorico[chave] || STATE.metasSnapshots.some(m=>m.campanhaId===campanhaId && m.chave===chave)) return;
  const snapshot={id:`${campanhaId}-${chave}`,campanhaId,chave,metas:{...campanha.metasDefault}};
  STATE.metasSnapshots.push(snapshot);
  if(!await storageSet('metas',STATE.metasSnapshots)){
    STATE.metasSnapshots=STATE.metasSnapshots.filter(m=>m.id!==snapshot.id);
    throw new Error(`Não foi possível registrar a meta deste mês (${chave}).`);
  }
}
function entregasValidadasDoMes(campanhaId, mes, ano){
  return ReciclarRankingLogic.filtrarEntregasValidadas(STATE.entregas,campanhaId,mes,ano);
}
function transferenciasDoMes(campanhaId, mes, ano){
  const chave = chaveMA(mes,ano);
  return STATE.transferencias.filter(t=>t.campanhaId===campanhaId && t.data && t.data.slice(0,7)===chave);
}
function mesAnteriorDe(campanhaId, mes, ano){
  let m=mes-1, a=ano;
  if(m<1){ m=12; a--; }
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return null;
  if(a<campanha.anoInicio || (a===campanha.anoInicio && m<campanha.mesInicio)) return null; // antes do início da campanha
  return {mes:m, ano:a};
}
function todosMesesEntre(mesA,anoA,mesB,anoB){
  const lista = [];
  let m=mesA, a=anoA;
  if(anoA*12+mesA > anoB*12+mesB) return lista;
  while(a<anoB || (a===anoB && m<=mesB)){
    lista.push({mes:m,ano:a});
    m++; if(m>12){ m=1; a++; }
  }
  return lista;
}
function todosMesesDaCampanhaAte(campanhaId, mesAlvo,anoAlvo){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return [{mes:mesAlvo,ano:anoAlvo}];
  return todosMesesEntre(campanha.mesInicio,campanha.anoInicio,mesAlvo,anoAlvo);
}
/* Janela de exibição do painel geral (gráfico de evolução + resumo de acompanhamento).
   Independente do cálculo de pontuação: aqui o usuário escolhe o ano e o período
   (3/6/12 meses, ano inteiro, ou intervalo personalizado) para a campanha já
   selecionada em STATE.campanhaSelecionadaId. */
function ultimoMesValidoNoAno(campanha, anoSelecionado){
  const hoje = mesAnoAtual();
  if(anoSelecionado > hoje.ano) return null;
  let mes = (anoSelecionado===hoje.ano) ? hoje.mes : 12;
  let ano = anoSelecionado;
  if(campanha && campanha.anoFim){
    const fimCampanha = campanha.anoFim*12+campanha.mesFim;
    if(ano*12+mes > fimCampanha){
      if(campanha.anoFim!==anoSelecionado) return null;
      mes = campanha.mesFim; ano = campanha.anoFim;
    }
  }
  if(campanha){
    const inicioCampanha = campanha.anoInicio*12+campanha.mesInicio;
    if(ano*12+mes < inicioCampanha) return null;
  }
  return {mes,ano};
}
function calcularJanelaPainel(){
  const pref = STATE.config.painelPeriodo;
  const campanha = campanhaPorId(STATE.campanhaSelecionadaId) || campanhaAtiva();
  if(!campanha) return { campanha:null, meses:[] };
  let meses = [];
  if(pref.tipo==='personalizado' && pref.mesInicio && pref.anoInicio && pref.mesFim && pref.anoFim){
    meses = todosMesesEntre(pref.mesInicio,pref.anoInicio,pref.mesFim,pref.anoFim);
  } else {
    const anoSel = pref.ano || mesAnoAtual().ano;
    const alvo = ultimoMesValidoNoAno(campanha, anoSel);
    if(!alvo) return { campanha, meses:[] };
    if(pref.tipo==='anoAtual'){
      meses = todosMesesEntre(1, anoSel, alvo.mes, alvo.ano);
    } else {
      const n = parseInt(pref.tipo,10) || 6;
      const todos = todosMesesEntre(campanha.mesInicio, campanha.anoInicio, alvo.mes, alvo.ano);
      meses = todos.slice(-n);
    }
  }
  const ini = campanha.anoInicio*12+campanha.mesInicio;
  const fim = campanha.anoFim? (campanha.anoFim*12+campanha.mesFim) : Infinity;
  meses = meses.filter(({mes,ano})=>{ const v=ano*12+mes; return v>=ini && v<=fim; });
  return { campanha, meses };
}
async function mudarPainelPeriodo(campo, valor){
  if(!exigirAdmin()){ renderApp(); return; }
  const pref = STATE.config.painelPeriodo;
  if(campo==='ano') pref.ano = valor? parseInt(valor,10) : null;
  else if(campo==='tipo') pref.tipo = valor;
  else if(['mesInicio','anoInicio','mesFim','anoFim'].includes(campo)) pref[campo] = parseInt(valor,10);
  await salvarConfig();
  renderApp();
}

/* Calcula, para cada colaborador e categoria, o saldo mês a mês desde o início da campanha
   até o mês alvo, já considerando: entregas validadas, transferências recebidas/enviadas, e
   o excedente (o que passou da meta) transportado automaticamente para o mês seguinte.
   Tudo isolado dentro da campanha informada — nada aqui vaza para outra campanha. */
function calcularSaldosAcumulados(campanhaId, mesAlvo,anoAlvo){
  const meses = todosMesesDaCampanhaAte(campanhaId, mesAlvo,anoAlvo);
  const categorias = categoriasDaCampanha(campanhaPorId(campanhaId));
  const saldos = {};
  STATE.colaboradores.forEach(c=>{ saldos[c.id]={}; categorias.forEach(cat=> saldos[c.id][cat.key]={}); });
  meses.forEach(({mes,ano})=>{
    const chave = chaveMA(mes,ano);
    const metas = getMetasDoMes(campanhaId, mes,ano);
    const transferencias = transferenciasDoMes(campanhaId, mes,ano);
    const trocas = trocasDoMes(campanhaId, mes,ano);
    const anterior = mesAnteriorDe(campanhaId, mes,ano);
    const chaveAnterior = anterior? chaveMA(anterior.mes,anterior.ano) : null;
    STATE.colaboradores.forEach(c=>{
      categorias.forEach(cat=>{
        let creditos = ReciclarRankingLogic.somarEntregasValidadas(
          STATE.entregas,campanhaId,mes,ano,c.id,cat.key,normalizarQuantidadeUnidades
        );
        transferencias.filter(t=>t.colaboradorDestinoId===c.id && t.categoriaDestino===cat.key).forEach(t=> creditos += t.quantidade);
        transferencias.filter(t=>t.colaboradorOrigemId===c.id && t.categoriaOrigem===cat.key).forEach(t=> creditos -= t.quantidade);
        trocas.filter(t=>t.colaboradorId===c.id && t.kitConsumido && t.kitConsumido[cat.key]).forEach(t=> creditos -= t.kitConsumido[cat.key]);
        const carryIn = chaveAnterior && saldos[c.id][cat.key][chaveAnterior] ? saldos[c.id][cat.key][chaveAnterior].leftover : 0;
        const meta = metas[cat.key] || cat.metaDefault;
        const {totalDisponivel,leftover} = ReciclarRankingLogic.calcularSaldoMensal(creditos,carryIn,meta);
        saldos[c.id][cat.key][chave] = { creditos, carryIn, totalDisponivel, leftover, meta };
      });
    });
  });
  return saldos;
}
function saldoDisponivelAntes(campanhaId, colaboradorId, categoria, mes, ano){
  const saldos = calcularSaldosAcumulados(campanhaId, mes,ano);
  const s = saldos[colaboradorId]?.[categoria]?.[chaveMA(mes,ano)];
  return s? s.totalDisponivel : 0;
}
function resultadosDoMesUsandoSaldos(saldos, campanhaId, mes, ano, setorFiltro){
  const chave = chaveMA(mes,ano);
  const categorias = categoriasDaCampanha(campanhaPorId(campanhaId));
  let colaboradores = STATE.colaboradores.filter(c=> !setorFiltro || c.setor===setorFiltro);
  colaboradores = colaboradores.filter(c=> !c.dataCadastro || c.dataCadastro.slice(0,7) <= chave);
  const entregasDoMes = entregasValidadasDoMes(campanhaId, mes,ano);
  const resultados = colaboradores.map(c=>{
    const totais = {}, percentuais = {}, percentuaisReais={}, frescos = {}, carryInsPorCategoria={}, totaisAcumulados = {}, metasPorCategoria = {}, categoriasAtingidas = {};
    categorias.forEach(cat=>{
      const s = saldos[c.id]?.[cat.key]?.[chave];
      const totalDisponivelBruto = s? s.totalDisponivel : 0;
      const meta = s? s.meta : (getMetasDoMes(campanhaId, mes,ano)[cat.key]||cat.metaDefault);
      const cumprimento = ReciclarRankingLogic.resumirCategoria(totalDisponivelBruto,meta);
      totais[cat.key] = cumprimento.quantidade;
      metasPorCategoria[cat.key] = meta;
      categoriasAtingidas[cat.key] = cumprimento.atingida;
      frescos[cat.key] = Math.max(0, s? s.creditos : 0);
      carryInsPorCategoria[cat.key] = Math.max(0, s? s.carryIn : 0);
      percentuais[cat.key] = cumprimento.percentual;
      percentuaisReais[cat.key] = meta>0 ? totalDisponivelBruto/meta*100 : 0;
      totaisAcumulados[cat.key] = Object.values(saldos[c.id]?.[cat.key] || {}).reduce((a,x)=>a+x.creditos, 0);
    });
    const percentuaisCapped = categorias.map(cat=>Math.min(100,percentuais[cat.key]));
    const pontuacao = percentuaisCapped.reduce((a,b)=>a+b,0)/categorias.length;
    const mediaReal = categorias.reduce((soma,cat)=>soma+percentuaisReais[cat.key],0)/categorias.length;
    const metaAtingida = categorias.every(cat=>categoriasAtingidas[cat.key]);
    const totalMateriais = Math.round(categorias.reduce((a,cat)=>a+totais[cat.key],0));
    const datasDoColaborador = entregasDoMes.filter(e=>e.colaboradorId===c.id).map(e=>e.data).sort();
    const primeiraEntrega = datasDoColaborador.length? datasDoColaborador[0] : null;
    return { colaborador:c, totais, carryInsPorCategoria, metasPorCategoria, totaisAcumulados, percentuais, pontuacao, mediaReal, metaAtingida, totalMateriais, primeiraEntrega };
  });
  resultados.sort((a,b)=>
    b.pontuacao-a.pontuacao
    || b.mediaReal-a.mediaReal
    || (a.primeiraEntrega||'9999-99-99').localeCompare(b.primeiraEntrega||'9999-99-99')
    || a.colaborador.nome.localeCompare(b.colaborador.nome)
  );
  return ReciclarRankingLogic.atribuirPosicoes(resultados);
}
function calcularResultadosMes(campanhaId, mes,ano,setorFiltro){
  const saldos = calcularSaldosAcumulados(campanhaId, mes,ano);
  return resultadosDoMesUsandoSaldos(saldos, campanhaId, mes, ano, setorFiltro);
}
function setoresExistentes(){
  return [...new Set(STATE.colaboradores.map(c=>c.setor).filter(Boolean))].sort();
}
function mesesComDados(campanhaId){
  const chaves = new Set();
  STATE.entregas.forEach(e=>{ if(e.campanhaId===campanhaId && e.data) chaves.add(e.data.slice(0,7)); });
  const campanha = campanhaPorId(campanhaId);
  if(campanha) Object.keys(campanha.metasHistorico||{}).forEach(k=>chaves.add(k));
  return [...chaves].sort().reverse();
}

async function alterarManutencaoPublica(ativada){
  if(!exigirAdmin()) return;
  if(STATE.salvandoManutencaoPublica) return;
  const anterior=STATE.manutencaoPublica;
  STATE.manutencaoPublica=ativada;
  STATE.salvandoManutencaoPublica=true;
  STATE.erroManutencaoPublica='';
  const checkbox=document.getElementById('manutencaoPublicaCheckbox');
  const erroElemento=document.getElementById('manutencaoPublicaErro');
  if(checkbox){checkbox.checked=ativada;checkbox.disabled=true;}
  if(erroElemento){erroElemento.textContent='';erroElemento.hidden=true;}
  try{
    if(STORAGE_MODE==='firestore'){
      await FIREBASE_DB.collection('reciclar-apac-public-settings').doc('maintenance').set({
        ativada,
        atualizadoEm:new Date().toISOString(),
      });
    }else{
      STATE.config.manutencaoPublica=ativada;
      if(!await salvarConfig()) throw STORAGE_ERRORS.get('config')||new Error('Não foi possível salvar a configuração local.');
    }
  }catch(erro){
    STATE.manutencaoPublica=anterior;
    if(STORAGE_MODE!=='firestore') STATE.config.manutencaoPublica=anterior;
    STATE.erroManutencaoPublica=erro.message||'Não foi possível atualizar o aviso público.';
    if(checkbox) checkbox.checked=anterior;
    if(erroElemento){
      erroElemento.textContent=STATE.erroManutencaoPublica;
      erroElemento.hidden=false;
    }
    console.error('Erro ao atualizar o modo de manutenção público',erro);
  }finally{
    STATE.salvandoManutencaoPublica=false;
    if(checkbox) checkbox.disabled=false;
  }
}

function abrirLoginAdmin(){
  if(STORAGE_MODE!=='firestore' || !FIREBASE_AUTH){
    alert('O login seguro só está disponível quando o Firebase Authentication está inicializado.');
    return;
  }

}
async function solicitarRedefinicaoSenhaLogin(){
  if(!FIREBASE_AUTH){ STATE.authError='O Firebase Authentication não está disponível.'; renderApp(); return; }
  const campoEmail=document.getElementById('authEmail');
  const email=campoEmail && campoEmail.value.trim();
  if(!email){
    campoEmail?.reportValidity();
    return;
  }
  if(!campoEmail.checkValidity()){ campoEmail.reportValidity(); return; }
  STATE.authEmail=email;
  STATE.authError='';
  STATE.authNotice='';
  try{
    await FIREBASE_AUTH.sendPasswordResetEmail(email);
    STATE.authNotice='Se houver uma conta cadastrada com esse e-mail, enviaremos um link de redefinição.';
  }catch(e){
    console.error('Erro ao solicitar redefinição de senha no login',e);
    STATE.authError=e.code==='auth/too-many-requests'
      ? 'Muitas tentativas. Aguarde antes de solicitar outro e-mail.'
      : e.code==='auth/operation-not-allowed'
        ? 'A redefinição por e-mail ainda não está habilitada no Firebase Authentication.'
        : 'Não foi possível solicitar a redefinição. Verifique sua conexão e tente novamente.';
  }
  renderApp();
}
async function confirmarLoginAdmin(){
  if(STATE.loginCarregando) return;
  if(!FIREBASE_AUTH){ STATE.authError='O Firebase Authentication não está disponível.'; renderApp(); return; }
  const email=document.getElementById('authEmail')?.value.trim();
  const senha=document.getElementById('authPassword')?.value;
  if(!email || !senha){ STATE.authError='Informe o e-mail e a senha.'; renderApp(); return; }
  STATE.authEmail=email;
  STATE.authError='';
  STATE.authNotice='';
  STATE.loginCarregando=true;
  renderApp();
  try{
    await FIREBASE_AUTH.signInWithEmailAndPassword(email,senha);
  }catch(e){
    STATE.loginCarregando=false;
    console.error('Erro ao autenticar usuário',e);
    const mensagens={
      'auth/too-many-requests':'Muitas tentativas. Aguarde antes de tentar novamente.',
      'auth/operation-not-allowed':'O acesso por e-mail e senha ainda não está habilitado no Firebase Authentication.',
      'auth/unauthorized-domain':'Este domínio ainda não foi autorizado no Firebase Authentication.',
      'auth/network-request-failed':'Não foi possível conectar ao Firebase. Verifique sua conexão e tente novamente.',
    };
    STATE.authError=mensagens[e.code] || 'Não foi possível entrar. Confira suas credenciais e tente novamente.';
    renderApp();
  }
}

function agendarSincronizacaoRankingsPublicos(key){
  if(!rankingPublicoSyncAtivo || !PUBLIC_RANKING_SOURCE_KEYS.has(key)

function mostrarErroSincronizacaoRankingPublico(erro){
  console.error('Erro ao atualizar ranking público automaticamente',erro);
  alert('Os dados foram salvos no aplicativo, mas a página pública não foi atualizada. Verifique se as regras do Firestore foram atualizadas e abra o app novamente para sincronizar.');
}
function agendarSincronizacaoRankingPublicoNaViradaDoMes(){
  clearTimeout(rankingPublicoSyncMesTimer);
  if(!rankingPublicoSyncAtivo) return;
  const agora=new Date();
  const chaveAgendada=chaveMA(agora.getMonth()+1,agora.getFullYear());
  const proximoMes=new Date(agora.getFullYear(),agora.getMonth()+1,1);
  const espera=Math.min(Math.max(1000,proximoMes.getTime()-agora.getTime()+1000),2147483000);
  rankingPublicoSyncMesTimer=setTimeout(()=>{
    if(!rankingPublicoSyncAtivo) return;
    const dataAtual=mesAnoAtual();
    const chaveAtual=chaveMA(dataAtual.mes,dataAtual.ano);
    if(chaveAtual!==chaveAgendada){
      sincronizarRankingsPublicos().catch(mostrarErroSincronizacaoRankingPublico);
    }
    agendarSincronizacaoRankingPublicoNaViradaDoMes();
  },espera);
}
function sincronizarRankingPublicoSeMesMudou(){
  if(!rankingPublicoSyncAtivo) return;
  const atual=mesAnoAtual();
  if(rankingPublicoUltimoMesSincronizado!==chaveMA(atual.mes,atual.ano)){
    sincronizarRankingsPublicos().catch(mostrarErroSincronizacaoRankingPublico);
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') sincronizarRankingPublicoSeMesMudou();
});
window.addEventListener('focus',sincronizarRankingPublicoSeMesMudou);
function chavePeriodoValida(chave){
  return typeof chave==='string' && /^[0-9]{4}-(0[1-9]|1[0-2])$/.test(chave);
}
async function sincronizarRankingsPublicos(){
  if(!rankingPublicoSyncAtivo || !FIREBASE_DB || !podeEditarDados()) return;
  if(rankingPublicoSyncPromise) return rankingPublicoSyncPromise;
  rankingPublicoSyncPendente=false;
  rankingPublicoSyncPromise=(async()=>{
    const [colaboradores,entregas,transferencias,trocas,campanhasCarregadas,metasSnapshots]=await Promise.all([
      storageGet('colaboradores',[]),
      storageGet('entregas',[]),
      storageGet('transferencias',[]),
      storageGet('trocas',[]),
      storageGet('campanhas',[]),
      storageGet('metas',[]),
    ]);
    if(!rankingPublicoSyncAtivo || !podeEditarDados()) return;
    STATE.colaboradores=colaboradores;
    STATE.entregas=entregas;
    STATE.transferencias=transferencias;
    STATE.trocas=trocas;
    STATE.campanhas=Array.isArray(campanhasCarregadas)?campanhasCarregadas:[];
    STATE.metasSnapshots=metasSnapshots;
    const colecao=FIREBASE_DB.collection('reciclar-apac-public-ranking');
    const snapshot=await colecao.get();
    const documentos=new Map(snapshot.docs.map(doc=>[doc.id,doc.data()]));
    const campanhas=STATE.campanhas;
    const campanhaIds=new Set(campanhas.map(campanha=>campanha.id));
    for(const doc of snapshot.docs){
      if(STATE.isAdmin && typeof doc.data().campanhaId==='string' && !campanhaIds.has(doc.data().campanhaId)){
        await doc.ref.delete();
        documentos.delete(doc.id);
      }
    }
    const atual=mesAnoAtual();
    for(const campanha of campanhas){
      const inicio=campanha.anoInicio*12+campanha.mesInicio;
      const fimCampanha=campanha.anoFim?campanha.anoFim*12+campanha.mesFim:Infinity;
      const fimPossivel=Math.min(atual.ano*12+atual.mes,fimCampanha);
      const fim=fimPossivel<inicio && atual.ano*12+atual.mes<inicio && fimCampanha>=inicio
        ? inicio
        : fimPossivel;
      const periodoInicio={mes:campanha.mesInicio,ano:campanha.anoInicio};
      const periodoFim={mes:fim%12||12,ano:Math.floor((fim-1)/12)};
      const periodos=new Set(inicio<=fim
        ? todosMesesEntre(periodoInicio.mes,periodoInicio.ano,periodoFim.mes,periodoFim.ano).map(({mes,ano})=>chaveMA(mes,ano))
        : []);
      mesesComDados(campanha.id).forEach(chave=>periodos.add(chave));
      STATE.entregas.concat(STATE.transferencias,STATE.trocas).forEach(registro=>{
        if(registro.campanhaId===campanha.id && registro.data) periodos.add(registro.data.slice(0,7));
      });
      STATE.metasSnapshots.forEach(metas=>{
        if(metas.campanhaId===campanha.id) periodos.add(metas.chave);
      });
      documentos.forEach(documento=>{
        if(documento.campanhaId===campanha.id && Number.isInteger(documento.mes) && Number.isInteger(documento.ano)){
          periodos.add(chaveMA(documento.mes,documento.ano));
        }
      });
      const categorias=categoriasDaCampanha(campanha);
      const periodosValidos=[...periodos].filter(chave=>{
        if(!chavePeriodoValida(chave)) return false;
        const [ano,mes]=chave.split('-').map(Number);
        const valor=ano*12+mes;
        return valor>=inicio && valor<=fim;
      }).sort();
      for(const chave of periodosValidos){
        const [ano,mes]=chave.split('-').map(Number);
        const cfgTroca=campanha.trocaCartela&&campanha.trocaCartela.ativo
          ?campanha.trocaCartela:null;
        const ranking=calcularResultadosMes(campanha.id,mes,ano)
          .map(resultado=>({
            resultado,
            itensTrocados:cfgTroca?ReciclarRankingLogic.somarItensTrocados(
              STATE.trocas,campanha.id,mes,ano,resultado.colaborador.id,
              Number(cfgTroca.cartelasPorKit)||1
            ):0,
          }))
          .filter(({resultado,itensTrocados})=>resultado.colaborador.status!=='desligado'
            && ReciclarRankingLogic.deveIncluirNoRankingPublico(resultado,itensTrocados))
          .map(({resultado,itensTrocados})=>({
            posicao:resultado.posicao||null,
            nome:resultado.colaborador.nome,
            pontuacao:Math.round(resultado.pontuacao),
            percentualGeral:resultado.mediaReal,
            totalMateriais:resultado.totalMateriais,
            ...(cfgTroca?{
              resumoTroca:(()=>{
                const nomeItem=String(cfgTroca.nomeItem||'item').trim();
                return {
                  quantidade:itensTrocados,
                  unidade:itensTrocados===1||/s$/i.test(nomeItem)?nomeItem:nomeItem+'s',
                };
              })(),
            }:{ }),
            detalhes:categorias.map(cat=>({
              nome:cat.label.split(' (')[0],
              unidade:cat.unidade,
              quantidade:resultado.totais[cat.key]||0,
              carryIn:resultado.carryInsPorCategoria[cat.key]||0,
              meta:resultado.metasPorCategoria[cat.key],
            })),
          }));
        const id=`${encodeURIComponent(campanha.id)}_${chave}`;
        const anterior=documentos.get(id);
        const mesAtual=chave===chaveMA(atual.mes,atual.ano);
        const temDados=mesAtual||ranking.length>0;
        if(!temDados && !anterior) continue;
        if(anterior && anterior.campanhaNome===campanha.nome
          && anterior.temDados===temDados
          && serializarEstavel(anterior.ranking)===serializarEstavel(ranking)) continue;
        const documento={
          campanhaId:campanha.id,
          campanhaNome:campanha.nome,
          mes,
          ano,
          atualizadoEm:new Date().toISOString(),
          temDados,
          ranking,
        };
        await colecao.doc(id).set(documento);
        documentos.set(id,documento);
      }
    }
    rankingPublicoUltimoMesSincronizado=chaveMA(atual.mes,atual.ano);
    if(STATE.authUser) renderApp();
  })();
  try{
    await rankingPublicoSyncPromise;
  }finally{
    rankingPublicoSyncPromise=null;
    if(rankingPublicoSyncPendente && rankingPublicoSyncAtivo){
      rankingPublicoSyncTimer=setTimeout(()=>{
        sincronizarRankingsPublicos().catch(mostrarErroSincronizacaoRankingPublico);
      },0);
    }
  }
}

function calcularResumoCampanha(saldosCompletos, campanhaId, mesesCampanha){
  const porColaborador = {};
  mesesCampanha.forEach(({mes,ano})=>{
    const resultados = resultadosDoMesUsandoSaldos(saldosCompletos, campanhaId, mes, ano);
    resultados.forEach(r=>{
      if(!porColaborador[r.colaborador.id]){
        porColaborador[r.colaborador.id] = { colaborador:r.colaborador, mesesParticipando:0, somaPontuacao:0, totalMateriais:0, mesesComMetaAtingida:0 };
      }
      const acc = porColaborador[r.colaborador.id];
      acc.mesesParticipando++;
      acc.somaPontuacao += r.pontuacao;
      acc.totalMateriais += r.totalMateriais;
      if(r.metaAtingida) acc.mesesComMetaAtingida++;
    });
  });
  const lista = Object.values(porColaborador).map(acc=> ({
    ...acc, mediaPontuacao: acc.mesesParticipando? acc.somaPontuacao/acc.mesesParticipando : 0
  }));
  lista.sort((a,b)=> b.mediaPontuacao-a.mediaPontuacao || b.totalMateriais-a.totalMateriais);
  return lista;
}
function ultimosMeses(n){
  const out=[]; let {mes,ano}=mesAnoAtual();
  for(let i=0;i<n;i++){ out.unshift({mes,ano}); mes--; if(mes<1){mes=12;ano--;} }
  return out;
}

}

function processarCsv(input){
  const file = input.files[0]; if(!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: (res)=>{
    const linhas = res.data.map(r=>{
      const keys = Object.keys(r); const get=(name)=>{ const k=keys.find(k=>k.toLowerCase().trim()===name); return k? (r[k]||'').trim() : ''; };
      return { nome:get('nome'), setor:get('setor'), cargo:get('cargo') };
    }).filter(r=>r.nome);
    if(linhas.length===0){ document.getElementById('csvPreview').innerHTML = `<div class="small-note" style="color:var(--vermelho);">Nenhum colaborador válido encontrado no arquivo.</div>`; return; }
    window._csvImportPreview = linhas;

async function salvarEntrega(id){
  if(!exigirOperador()) return;
  const anteriores=STATE.entregas.map(e=>({...e}));
  const entregaOriginal=id?STATE.entregas.find(x=>x.id===id):null;
  if(id && !entregaOriginal){ alert('A entrega não foi encontrada. Atualize a página e tente novamente.'); return; }
  const data = document.getElementById('fData').value;
  const colaboradorId = document.getElementById('fColab').value;
  const tipo = entregaOriginal?entregaOriginal.tipo:document.getElementById('fTipo').value;
  const quantidade = parseFloat(document.getElementById('fQtd').value);
  const unidadeEl = document.getElementById('fUnidade');
  const unidade = unidadeEl ? unidadeEl.value : 'unidades';
  const responsavelContagem = document.getElementById('fResp').value.trim();
  const observacoes = document.getElementById('fObs').value.trim();
  const statusValidacao = document.getElementById('fStatusValid').value;
  if(!data || !colaboradorId || !tipo || isNaN(quantidade) || quantidade<0){ alert('Preencha data, colaborador, tipo de material e uma quantidade válida.'); return; }
  if(!ReciclarRankingLogic.quantidadeUnitariaValida(quantidade,tipo==='latinhas'&&unidade==='kg')){
    alert('A quantidade desta categoria precisa ser informada em unidades inteiras.');
    return;
  }
  const campanhaId = entregaOriginal?entregaOriginal.campanhaId:STATE.campanhaSelecionadaId;
  const validacao = dataDentroDaCampanha(campanhaId, data);
  if(!validacao.ok){ alert(validacao.motivo); return; }
  const payload = {data,colaboradorId,tipo,quantidade,unidade,responsavelContagem,observacoes,statusValidacao,campanhaId};
  if(id){
    const idx = STATE.entregas.findIndex(x=>x.id===id);
    STATE.entregas[idx] = {...STATE.entregas[idx], ...payload};
  } else {
    STATE.entregas.push({id:uid(), criadoEm:Date.now(), ...payload});
  }
  try{
    await garantirSnapshotMetas(campanhaId, +data.slice(5,7), +data.slice(0,4));
    if(!await salvarEntregas()) throw new Error('O Firebase recusou a gravação.');
  }catch(e){
    STATE.entregas=anteriores;
    console.error('Erro ao salvar entrega',e);
    alert(e.message || 'Não foi possível salvar a entrega. Atualize a página e tente novamente.');
    return;
  }
  fecharModal(); renderApp();
}

function renderSaldoTransportado(mes,ano){
  const wrap = document.getElementById('saldoTransportadoWrap');
  if(!wrap) return;
  const campanhaId = STATE.campanhaSelecionadaId;
  const chave = chaveMA(mes,ano);
  const saldos = calcularSaldosAcumulados(campanhaId, mes,ano);
  const porColaborador = {};
  const categorias = categoriasDaCampanha(campanhaPorId(campanhaId));
  STATE.colaboradores.forEach(c=>{
    categorias.forEach(cat=>{
      const s = saldos[c.id]?.[cat.key]?.[chave];
      if(s && s.carryIn > 0){
        if(!porColaborador[c.id]) porColaborador[c.id] = { colaborador:c, total:0, itens:[] };
        porColaborador[c.id].total += s.carryIn;
        porColaborador[c.id].itens.push({ categoria: cat.label.split(' (')[0], valor: s.carryIn });
      }
    });
  });
  const lista = Object.values(porColaborador).sort((a,b)=> b.total-a.total);
  if(lista.length===0){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  wrap.style.display='block';
  window._excedentesPorColaborador = lista;
  wrap.innerHTML = `
    <div class="stat-label">Excedente trazido de meses anteriores para ${nomeMes(mes)}/${ano}</div>
    <p class="small-note" style="margin:4px 0 10px 0;">Crédito que sobrou da meta batida em meses passados, já incluído automaticamente no cálculo deste mês. ${lista.length} colaborador(es) com excedente.</p>
