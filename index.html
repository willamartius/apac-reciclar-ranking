<style>

.podium-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:18px;}

.loading-screen{position:fixed;inset:0;background:var(--verde-900);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:10px;z-index:999;}

<div id="loading" class="loading-screen">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8FCB9E" stroke-width="1.8"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
  <div class="serif" style="font-size:15px;">Carregando o ranking…</div>
</div>

<div id="app" style="display:none;"></div>

<script>
/* =========================================================
   RECICLAR É CUIDAR DA CASA COMUM — APAC IMPERATRIZ
   Aplicativo de ranking de arrecadação de recicláveis
   ========================================================= */

/* ---------- CONSTANTES DO REGULAMENTO ---------- */
const CATEGORIAS = [
  { key:'latinhas',  label:'Latinhas (refrigerante, cerveja, energético)', metaDefault:150, unidade:'unidades', aceitaKg:true, unidadesPorKg:75 },
  { key:'pet',       label:'Garrafas PET',                                  metaDefault:250, unidade:'unidades' },
  { key:'embalagens',label:'Embalagens plásticas (arroz, açúcar, leite, sal, fardos)', metaDefault:100, unidade:'unidades' },
  { key:'papelao',   label:'Caixas de papelão',                             metaDefault:100, unidade:'unidades' },
  { key:'latas',     label:'Latas em geral (sardinha, leite, kitut, feijoada)', metaDefault:80, unidade:'unidades' },
  { key:'ovos',      label:'Cartelas de ovos (30 unidades)',                metaDefault:25,  unidade:'cartelas' },
];
const TIPO_OUTROS = 'outros';
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATEGORIA_MAP = Object.fromEntries(CATEGORIAS.map(c=>[c.key,c]));
/* Cada campanha pode personalizar o nome exibido das seis categorias oficiais do
   regulamento (a chave interna nunca muda, só o rótulo) e também cadastrar materiais
   extras próprios, com sua própria meta. categoriasDaCampanha() devolve a lista completa
   (oficiais + extras) que o cálculo de pontuação, os formulários e os relatórios usam. */
function categoriasDaCampanha(campanha){
  const desativadas = (campanha && campanha.categoriasDesativadas) || [];
  const oficiais = CATEGORIAS
    .filter(cat => !desativadas.includes(cat.key))
    .map(cat => ({
      ...cat,
      label: (campanha && campanha.nomesPersonalizados && campanha.nomesPersonalizados[cat.key]) || cat.label,
    }));
  const extras = (campanha && campanha.materiaisExtras) || [];
  return [...oficiais, ...extras];
}
// Igual à anterior, mas sem excluir materiais desativados — usada só para exibir o nome de
// um material em registros já existentes (tabelas, CSV), nunca para calcular pontuação.
function todasCategoriasDaCampanha(campanha){
  const oficiais = CATEGORIAS.map(cat => ({
    ...cat,
    label: (campanha && campanha.nomesPersonalizados && campanha.nomesPersonalizados[cat.key]) || cat.label,
  }));
  const extras = (campanha && campanha.materiaisExtras) || [];
  return [...oficiais, ...extras];
}
function resolverCategoria(campanhaId, tipoKey){
  const campanha = campanhaPorId(campanhaId);
  return todasCategoriasDaCampanha(campanha).find(cat => cat.key === tipoKey) || null;
}

/* ---------- ESTADO ---------- */
let STATE = {
  colaboradores: [],
  entregas: [],
  transferencias: [],
  campanhas: [],
  campanhaSelecionadaId: null,
  config: null,
  isAdmin: false,
  view: 'dashboard',
  dashMes: null, dashAno: null,
  rankMes: null, rankAno: null, rankSetor: '',
  histMes: null, histAno: null,
};
/* ---------- HELPERS DE ARMAZENAMENTO ---------- */
/* Este app funciona em dois ambientes:
   1) Dentro do Claude (como artefato) -> usa window.storage automaticamente.
   2) Hospedado fora (ex: GitHub Pages) -> usa o banco Firebase configurado abaixo em
      FIREBASE_CONFIG. Essa configuração é pública por natureza (é assim que todo app
      Firebase funciona) e não controla quem pode editar dados — quem controla isso é a
      senha de administrador do próprio app, mais abaixo.
   Se nenhum dos dois estiver disponível, o app usa o armazenamento local do navegador
   como último recurso, só para não travar, mas nesse caso os dados não são compartilhados. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDMpYOJrypaiE05HUoHNERSZTBhwj2Vouo",
  authDomain: "apac-reciclar.firebaseapp.com",
  projectId: "apac-reciclar",
  storageBucket: "apac-reciclar.firebasestorage.app",
  messagingSenderId: "309128467158",
  appId: "1:309128467158:web:a3a1c14fed86b00020ef77"
};

let FIREBASE_DB = null;
let STORAGE_MODE = 'none';

function inicializarFirebase(config){
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    FIREBASE_DB = firebase.firestore();
    return true;
  }catch(e){ console.error('Erro ao iniciar Firebase', e); return false; }
}
async function detectarModoArmazenamento(){
  if(window.storage){ STORAGE_MODE='claude'; return; }
  if(FIREBASE_CONFIG && typeof firebase!=='undefined' && inicializarFirebase(FIREBASE_CONFIG)){ STORAGE_MODE='firestore'; return; }
  STORAGE_MODE='local';
}
async function storageGet(key, fallback){
  try{
    if(STORAGE_MODE==='claude'){
      const r = await window.storage.get(key, true);
      return r && r.value !== undefined ? JSON.parse(r.value) : fallback;
    }
    if(STORAGE_MODE==='firestore'){
      const doc = await FIREBASE_DB.collection('reciclar-apac').doc(key).get();
      return doc.exists && doc.data().value !== undefined ? JSON.parse(doc.data().value) : fallback;
    }
    const raw = localStorage.getItem('reciclar-apac:'+key);
    return raw!==null ? JSON.parse(raw) : fallback;
  }catch(e){ console.error('Erro ao carregar', key, e); return fallback; }
}
async function storageSet(key, value){
  try{
    if(STORAGE_MODE==='claude'){ await window.storage.set(key, JSON.stringify(value), true); return true; }
    if(STORAGE_MODE==='firestore'){ await FIREBASE_DB.collection('reciclar-apac').doc(key).set({value: JSON.stringify(value)}); return true; }
    localStorage.setItem('reciclar-apac:'+key, JSON.stringify(value)); return true;
  }catch(e){
    console.error('Erro ao salvar', key, e);
    return false;
  }
}
function defaultConfig(){
  return {
    senhaAdmin: '1234',
    temDadosTeste: true,
    painelPeriodo: { ano: null, tipo: '6' }, // ver calcularJanelaPainel() — a campanha é escolhida à parte, em STATE.campanhaSelecionadaId
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hoje(){ return new Date(); }
function mesAnoAtual(){ const d=hoje(); return {mes:d.getMonth()+1, ano:d.getFullYear()}; }
function chaveMA(mes,ano){ return ano+'-'+String(mes).padStart(2,'0'); }
function nomeMes(mes){ return MESES_PT[mes-1]; }

/* ---------- DADOS FICTÍCIOS DE DEMONSTRAÇÃO ---------- */
function gerarDadosTeste(campanhaId){
  const {mes,ano} = mesAnoAtual();
  const setores = ['Administrativo','Marcenaria','Costura','Cozinha','Horta'];
  const nomes = ['Antônio Souza','Maria Aparecida Lima','José Carlos Ferreira','Francisca Nascimento','Raimundo Pereira','Luzia Costa','Pedro Henrique Alves','Cícera Santos'];
  const colaboradores = nomes.map((n,i)=>({
    id: uid(), nome:n, setor:setores[i%setores.length], cargo:'Colaborador(a)',
    status:'ativo', dataCadastro: new Date(ano,mes-2,10).toISOString().slice(0,10)
  }));
  const entregas = [];
  colaboradores.forEach((c,i)=>{
    const fator = [1.1,0.6,0.95,0.4,1.3,0.7,1.0,0.5][i%8];
    CATEGORIAS.forEach(cat=>{
      const base = cat.metaDefault*fator*(0.7+Math.random()*0.5);
      entregas.push({
        id: uid(), campanhaId, data:new Date(ano,mes-1,8+ (i%15)).toISOString().slice(0,10),
        colaboradorId:c.id, tipo:cat.key,
        quantidade: Math.max(1, Math.round(cat.key==='latinhas'&&cat.aceitaKg? base/cat.unidadesPorKg*10 : base)),
        unidade: cat.key==='latinhas' ? 'kg-x10' : 'unidades',
        observacoes:'', responsavelContagem:'Encarregada Financeira',
        statusValidacao:'validado',
        criadoEm:Date.now()
      });
    });
  });
  return {colaboradores, entregas};
}
// nota: para simplificar a quantidade fictícia de latinhas, usamos "kg-x10" (décimos de kg) só nos dados de teste;
// no registro real de entregas, latinhas usa 'kg' ou 'unidades' normalmente (ver normalizarQuantidade).

/* ---------- CAMPANHAS ----------
   Cada campanha é uma entidade independente e explícita: toda entrega e toda
   transferência guardam o campo campanhaId dizendo a qual campanha pertencem.
   A data do registro NUNCA decide a campanha — duas campanhas podem ter
   períodos sobrepostos, ou até entregas na mesma data, sem nenhum conflito.
   Cada campanha tem suas próprias metas (com histórico mês a mês) e seu
   próprio acúmulo de excedente, isolado das demais. */
const CAMPANHA_LEGADO_INICIO = { mes: 5, ano: 2026 }; // usado só na migração da 1ª vez
const CAMPANHA_LEGADO_ID = 'campanha-legado-reciclar-2026'; // id estável — nunca gerado de novo a cada migração
function campanhasOrdenadas(){
  return [...STATE.campanhas].sort((a,b)=> (a.anoInicio*12+a.mesInicio) - (b.anoInicio*12+b.mesInicio));
}
function campanhaPorId(id){ return STATE.campanhas.find(c=>c.id===id) || null; }
function campanhaAtiva(){
  const ordenadas = campanhasOrdenadas();
  const ativas = ordenadas.filter(c=>c.status==='ativa');
  if(ativas.length) return ativas[ativas.length-1];
  return ordenadas.length? ordenadas[ordenadas.length-1] : null;
}
function campanhaTemEntregas(campanhaId){
  return STATE.entregas.some(e=>e.campanhaId===campanhaId) || STATE.transferencias.some(t=>t.campanhaId===campanhaId);
}
async function salvarCampanhas(){ await storageSet('campanhas', STATE.campanhas); }
async function migrarParaCampanhas(configAntigo){
  // Idempotente: nunca substitui a lista de campanhas já existente, nunca gera um id novo
  // para a campanha histórica, e só toca em entregas/transferências que ainda não têm
  // campanhaId. Rodar esta função mais de uma vez não deve mudar nada que já esteja migrado.
  let campanhas = Array.isArray(STATE.campanhas) && STATE.campanhas.length ? [...STATE.campanhas] : [];
  let campanhaLegado = campanhas.find(c => c.id === CAMPANHA_LEGADO_ID)
    || campanhas.find(c => c.nome === 'Reciclar é Cuidar da Casa Comum'); // reconhece a legada mesmo se já existir com outro id
  if(!campanhaLegado){
    const metasDefault = (configAntigo && configAntigo.metasDefault) || Object.fromEntries(CATEGORIAS.map(c=>[c.key,c.metaDefault]));
    const metasHistorico = (configAntigo && configAntigo.metasHistorico) || {};
    campanhaLegado = {
      id: CAMPANHA_LEGADO_ID,
      nome: 'Reciclar é Cuidar da Casa Comum',
      mesInicio: CAMPANHA_LEGADO_INICIO.mes, anoInicio: CAMPANHA_LEGADO_INICIO.ano,
      mesFim: null, anoFim: null,
      status: 'ativa',
      metasDefault, metasHistorico,
    };
    campanhas.push(campanhaLegado);
  }
  STATE.campanhas = campanhas;
  await salvarCampanhas();
  // registros já existentes (entregas e transferências anteriores a esta versão) que ainda não
  // têm campanhaId são associados à campanha legada; registros que já têm campanhaId — de
  // qualquer campanha — nunca são alterados.
  let mudouEntregas=false, mudouTransf=false;
  STATE.entregas.forEach(e=>{ if(!e.campanhaId){ e.campanhaId = campanhaLegado.id; mudouEntregas=true; } });
  STATE.transferencias.forEach(t=>{ if(!t.campanhaId){ t.campanhaId = campanhaLegado.id; mudouTransf=true; } });
  if(mudouEntregas) await salvarEntregas();
  if(mudouTransf) await salvarTransferencias();
  return campanhaLegado;
}

/* ---------- CARREGAMENTO INICIAL ---------- */
async function carregarDados(){
  STATE.colaboradores = await storageGet('colaboradores', []);
  STATE.entregas = await storageGet('entregas', []);
  STATE.transferencias = await storageGet('transferencias', []);
  STATE.config = await storageGet('config', null);
  const configAntigoParaMigrar = STATE.config; // pode conter metasDefault/metasHistorico do formato anterior
  const primeiraExecucao = !STATE.config;
  if(!STATE.config){
    STATE.config = defaultConfig();
    await storageSet('config', STATE.config);
  }
  if(!STATE.config.painelPeriodo) STATE.config.painelPeriodo = { ano: null, tipo: '6' };
  STATE.campanhas = await storageGet('campanhas', null);
  if(!STATE.campanhas){
    const campanhaLegado = await migrarParaCampanhas(configAntigoParaMigrar);
    if(primeiraExecucao && STATE.colaboradores.length===0 && STATE.entregas.length===0){
      const demo = gerarDadosTeste(campanhaLegado.id);
      STATE.colaboradores = demo.colaboradores;
      STATE.entregas = demo.entregas;
      await storageSet('colaboradores', STATE.colaboradores);
      await storageSet('entregas', STATE.entregas);
    }
  } else {
    // Correção de auto-cura: entregas ou transferências criadas por uma versão intermediária
    // do app (sem o campo campanhaId ainda implementado) ficariam invisíveis para sempre, já
    // que a migração só roda quando a coleção de campanhas ainda não existe. Aqui, toda vez
    // que o app carrega, qualquer registro sem campanhaId é associado à campanha legada,
    // sem tocar em nenhum registro que já tenha uma campanha definida.
    const legado = campanhaPorId(CAMPANHA_LEGADO_ID)
      || STATE.campanhas.find(c => c.nome === 'Reciclar é Cuidar da Casa Comum')
      || campanhaAtiva();
    if(legado){
      let mudouEntregas=false, mudouTransf=false;
      STATE.entregas.forEach(e=>{ if(!e.campanhaId){ e.campanhaId = legado.id; mudouEntregas=true; } });
      STATE.transferencias.forEach(t=>{ if(!t.campanhaId){ t.campanhaId = legado.id; mudouTransf=true; } });
      if(mudouEntregas) await salvarEntregas();
      if(mudouTransf) await salvarTransferencias();
    }
  }
  STATE.campanhaSelecionadaId = (campanhaAtiva()||{}).id || null;
  const {mes,ano} = mesAnoAtual();
  STATE.dashMes=mes; STATE.dashAno=ano;
  STATE.rankMes=mes; STATE.rankAno=ano;
  STATE.histMes=mes; STATE.histAno=ano;
}
async function salvarColaboradores(){ await storageSet('colaboradores', STATE.colaboradores); }
async function salvarEntregas(){ await storageSet('entregas', STATE.entregas); }
async function salvarTransferencias(){ await storageSet('transferencias', STATE.transferencias); }
async function salvarConfig(){ await storageSet('config', STATE.config); }
function mudarCampanhaSelecionada(id){ STATE.campanhaSelecionadaId = id; renderApp(); }
window.mudarCampanhaSelecionada = mudarCampanhaSelecionada;
/* A campanha nunca é escolhida pela data — mas, depois de escolhida, a data do
   registro precisa estar dentro do período daquela campanha específica. */
function dataDentroDaCampanha(campanhaId, dataISO){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha || !dataISO) return { ok:false, motivo:'Selecione uma campanha válida.' };
  const mes = +dataISO.slice(5,7), ano = +dataISO.slice(0,4);
  const alvo = ano*12+mes;
  const inicio = campanha.anoInicio*12+campanha.mesInicio;
  const fim = campanha.anoFim? (campanha.anoFim*12+campanha.mesFim) : Infinity;
  if(alvo<inicio){
    return { ok:false, motivo:`Essa data é anterior ao início da campanha "${campanha.nome}" (${nomeMes(campanha.mesInicio)}/${campanha.anoInicio}).` };
  }
  if(alvo>fim){
    return { ok:false, motivo:`Essa data é posterior ao encerramento da campanha "${campanha.nome}" (${nomeMes(campanha.mesFim)}/${campanha.anoFim}).` };
  }
  return { ok:true };
}

/* ---------- LÓGICA DE NEGÓCIO ---------- */
function normalizarQuantidadeUnidades(entrega){
  if(entrega.tipo==='latinhas'){
    const cat = CATEGORIA_MAP.latinhas;
    if(entrega.unidade==='kg') return entrega.quantidade * cat.unidadesPorKg;
    if(entrega.unidade==='kg-x10') return (entrega.quantidade/10) * cat.unidadesPorKg;
    return entrega.quantidade;
  }
  return entrega.quantidade;
}
function getMetasDoMes(campanhaId, mes, ano){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return Object.fromEntries(CATEGORIAS.map(c=>[c.key,c.metaDefault]));
  const chave = chaveMA(mes,ano);
  if(campanha.metasHistorico[chave]) return campanha.metasHistorico[chave];
  return campanha.metasDefault;
}
async function garantirSnapshotMetas(campanhaId, mes, ano){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return;
  const chave = chaveMA(mes,ano);
  if(!campanha.metasHistorico[chave]){
    campanha.metasHistorico[chave] = {...campanha.metasDefault};
    await salvarCampanhas();
  }
}
function entregasValidadasDoMes(campanhaId, mes, ano){
  const chave = chaveMA(mes,ano);
  return STATE.entregas.filter(e=>e.campanhaId===campanhaId && e.statusValidacao==='validado' && e.data && e.data.slice(0,7)===chave);
}
function transferenciasDoMes(campanhaId, mes, ano){
  const chave = chaveMA(mes,ano);
  return STATE.transferencias.filter(t=>t.campanhaId===campanhaId && t.data && t.data.slice(0,7)===chave);
}
function mesAnteriorDe(campanhaId, mes, ano){
  let m=mes-1, a=ano;
  if(m<1){ m=12; a--; }
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return null;
  if(a<campanha.anoInicio || (a===campanha.anoInicio && m<campanha.mesInicio)) return null; // antes do início da campanha
  return {mes:m, ano:a};
}
function todosMesesEntre(mesA,anoA,mesB,anoB){
  const lista = [];
  let m=mesA, a=anoA;
  if(anoA*12+mesA > anoB*12+mesB) return lista;
  while(a<anoB || (a===anoB && m<=mesB)){
    lista.push({mes:m,ano:a});
    m++; if(m>12){ m=1; a++; }
  }
  return lista;
}
function todosMesesDaCampanhaAte(campanhaId, mesAlvo,anoAlvo){
  const campanha = campanhaPorId(campanhaId);
  if(!campanha) return [{mes:mesAlvo,ano:anoAlvo}];
  return todosMesesEntre(campanha.mesInicio,campanha.anoInicio,mesAlvo,anoAlvo);
}
/* Janela de exibição do painel geral (gráfico de evolução + resumo de acompanhamento).
   Independente do cálculo de pontuação: aqui o usuário escolhe o ano e o período
   (3/6/12 meses, ano inteiro, ou intervalo personalizado) para a campanha já
   selecionada em STATE.campanhaSelecionadaId. */
function ultimoMesValidoNoAno(campanha, anoSelecionado){
  const hoje = mesAnoAtual();
  if(anoSelecionado > hoje.ano) return null;
  let mes = (anoSelecionado===hoje.ano) ? hoje.mes : 12;
  let ano = anoSelecionado;
  if(campanha && campanha.anoFim){
    const fimCampanha = campanha.anoFim*12+campanha.mesFim;
    if(ano*12+mes > fimCampanha){
      if(campanha.anoFim!==anoSelecionado) return null;
      mes = campanha.mesFim; ano = campanha.anoFim;
    }
  }
  if(campanha){
    const inicioCampanha = campanha.anoInicio*12+campanha.mesInicio;
    if(ano*12+mes < inicioCampanha) return null;
  }
  return {mes,ano};
}
function calcularJanelaPainel(){
  const pref = STATE.config.painelPeriodo;
  const campanha = campanhaPorId(STATE.campanhaSelecionadaId) || campanhaAtiva();
  if(!campanha) return { campanha:null, meses:[] };
  let meses = [];
  if(pref.tipo==='personalizado' && pref.mesInicio && pref.anoInicio && pref.mesFim && pref.anoFim){
    meses = todosMesesEntre(pref.mesInicio,pref.anoInicio,pref.mesFim,pref.anoFim);
  } else {
    const anoSel = pref.ano || mesAnoAtual().ano;
    const alvo = ultimoMesValidoNoAno(campanha, anoSel);
    if(!alvo) return { campanha, meses:[] };
    if(pref.tipo==='anoAtual'){
      meses = todosMesesEntre(1, anoSel, alvo.mes, alvo.ano);
    } else {
      const n = parseInt(pref.tipo,10) || 6;
      const todos = todosMesesEntre(campanha.mesInicio, campanha.anoInicio, alvo.mes, alvo.ano);
      meses = todos.slice(-n);
    }
  }
  const ini = campanha.anoInicio*12+campanha.mesInicio;
  const fim = campanha.anoFim? (campanha.anoFim*12+campanha.mesFim) : Infinity;
  meses = meses.filter(({mes,ano})=>{ const v=ano*12+mes; return v>=ini && v<=fim; });
  return { campanha, meses };
}
async function mudarPainelPeriodo(campo, valor){
  if(!exigirAdmin()){ renderApp(); return; }
  const pref = STATE.config.painelPeriodo;
  if(campo==='ano') pref.ano = valor? parseInt(valor,10) : null;
  else if(campo==='tipo') pref.tipo = valor;
  else if(['mesInicio','anoInicio','mesFim','anoFim'].includes(campo)) pref[campo] = parseInt(valor,10);
  await salvarConfig();
  renderApp();
}
window.mudarPainelPeriodo = mudarPainelPeriodo;
/* Calcula, para cada colaborador e categoria, o saldo mês a mês desde o início da campanha
   até o mês alvo, já considerando: entregas validadas, transferências recebidas/enviadas, e
   o excedente (o que passou da meta) transportado automaticamente para o mês seguinte.
   Tudo isolado dentro da campanha informada — nada aqui vaza para outra campanha. */
function calcularSaldosAcumulados(campanhaId, mesAlvo,anoAlvo){
  const meses = todosMesesDaCampanhaAte(campanhaId, mesAlvo,anoAlvo);
  const categorias = categoriasDaCampanha(campanhaPorId(campanhaId));
  const saldos = {};
  STATE.colaboradores.forEach(c=>{ saldos[c.id]={}; categorias.forEach(cat=> saldos[c.id][cat.key]={}); });
  meses.forEach(({mes,ano})=>{
    const chave = chaveMA(mes,ano);
    const metas = getMetasDoMes(campanhaId, mes,ano);
    const entregas = entregasValidadasDoMes(campanhaId, mes,ano);
    const transferencias = transferenciasDoMes(campanhaId, mes,ano);
    const anterior = mesAnteriorDe(campanhaId, mes,ano);
    const chaveAnterior = anterior? chaveMA(anterior.mes,anterior.ano) : null;
    STATE.colaboradores.forEach(c=>{
      categorias.forEach(cat=>{
        let creditos = 0;
        entregas.filter(e=>e.colaboradorId===c.id && e.tipo===cat.key).forEach(e=> creditos += normalizarQuantidadeUnidades(e));
        transferencias.filter(t=>t.colaboradorDestinoId===c.id && t.categoriaDestino===cat.key).forEach(t=> creditos += t.quantidade);
        transferencias.filter(t=>t.colaboradorOrigemId===c.id && t.categoriaOrigem===cat.key).forEach(t=> creditos -= t.quantidade);
        const carryIn = chaveAnterior && saldos[c.id][cat.key][chaveAnterior] ? saldos[c.id][cat.key][chaveAnterior].leftover : 0;
        const meta = metas[cat.key] || cat.metaDefault;
        const totalDisponivel = creditos + carryIn;
        const leftover = Math.max(0, totalDisponivel - meta);
        saldos[c.id][cat.key][chave] = { creditos, carryIn, totalDisponivel, leftover, meta };
      });
    });
  });
  return saldos;
}
function saldoDisponivelAntes(campanhaId, colaboradorId, categoria, mes, ano){
  const saldos = calcularSaldosAcumulados(campanhaId, mes,ano);
  const s = saldos[colaboradorId]?.[categoria]?.[chaveMA(mes,ano)];
  return s? s.totalDisponivel : 0;
}
function resultadosDoMesUsandoSaldos(saldos, campanhaId, mes, ano, setorFiltro){
  const chave = chaveMA(mes,ano);
  const categorias = categoriasDaCampanha(campanhaPorId(campanhaId));
  let colaboradores = STATE.colaboradores.filter(c=> !setorFiltro || c.setor===setorFiltro);
  colaboradores = colaboradores.filter(c=> !c.dataCadastro || c.dataCadastro.slice(0,7) <= chave);
  const entregasDoMes = entregasValidadasDoMes(campanhaId, mes,ano);
  const resultados = colaboradores.map(c=>{
    const totais = {}, percentuais = {}, frescos = {};
    categorias.forEach(cat=>{
      const s = saldos[c.id]?.[cat.key]?.[chave];
      const totalDisponivel = s? s.totalDisponivel : 0;
      const meta = s? s.meta : (getMetasDoMes(campanhaId, mes,ano)[cat.key]||cat.metaDefault);
      totais[cat.key] = totalDisponivel;
      frescos[cat.key] = Math.max(0, s? s.creditos : 0);
      percentuais[cat.key] = meta>0 ? (totalDisponivel/meta*100) : 0;
    });
    const percentuaisCapped = categorias.map(cat=>Math.min(100,percentuais[cat.key]));
    const pontuacao = percentuaisCapped.reduce((a,b)=>a+b,0)/categorias.length;
    const percentuaisReais = categorias.map(cat=>percentuais[cat.key]);
    const mediaReal = percentuaisReais.reduce((a,b)=>a+b,0)/categorias.length;
    const metaAtingida = categorias.every(cat=>percentuais[cat.key]>=100);
    const totalMateriais = Math.round(categorias.reduce((a,cat)=>a+frescos[cat.key],0));
    const datasDoColaborador = entregasDoMes.filter(e=>e.colaboradorId===c.id).map(e=>e.data).sort();
    const primeiraEntrega = datasDoColaborador.length? datasDoColaborador[0] : null;
    return { colaborador:c, totais, percentuais, pontuacao, mediaReal, metaAtingida, totalMateriais, primeiraEntrega };
  });
  resultados.sort((a,b)=>
    b.pontuacao-a.pontuacao
    || b.mediaReal-a.mediaReal
    || (a.primeiraEntrega||'9999-99-99').localeCompare(b.primeiraEntrega||'9999-99-99')
    || a.colaborador.nome.localeCompare(b.colaborador.nome)
  );
  let posAtual=0, vistos=0, ultimoScore=null, ultimaMedia=null, ultimaData=null;
  resultados.forEach(r=>{
    if(r.pontuacao<=0){ r.posicao = null; return; } // sem pontuação: não ocupa posição nem recebe medalha
    vistos++;
    const empatado = ultimoScore!==null && Math.abs(r.pontuacao-ultimoScore)<0.001 && Math.abs(r.mediaReal-ultimaMedia)<0.001 && (r.primeiraEntrega||null)===ultimaData;
    if(!empatado) posAtual = vistos;
    r.posicao = posAtual;
    ultimoScore = r.pontuacao; ultimaMedia = r.mediaReal; ultimaData = r.primeiraEntrega||null;
  });
  return resultados;
}
function calcularResultadosMes(campanhaId, mes,ano,setorFiltro){
  const saldos = calcularSaldosAcumulados(campanhaId, mes,ano);
  return resultadosDoMesUsandoSaldos(saldos, campanhaId, mes, ano, setorFiltro);
}
function setoresExistentes(){
  return [...new Set(STATE.colaboradores.map(c=>c.setor).filter(Boolean))].sort();
}
function mesesComDados(campanhaId){
  const chaves = new Set();
  STATE.entregas.forEach(e=>{ if(e.campanhaId===campanhaId && e.data) chaves.add(e.data.slice(0,7)); });
  const campanha = campanhaPorId(campanhaId);
  if(campanha) Object.keys(campanha.metasHistorico||{}).forEach(k=>chaves.add(k));
  return [...chaves].sort().reverse();
}

function renderSeletorPainelPeriodo(campanhaPainel){

  const anoMax = campanhaPainel? (campanhaPainel.anoFim || hoje.ano) : hoje.ano;
  const anos = []; for(let a=anoMin; a<=anoMax; a++) anos.push(a);
  const anoSelecionado = pref.ano || hoje.ano;
  const tipo = pref.tipo || '6';
  return `
    <div class="filters">
      <div>
        <label style="display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Campanha</label>

      <div>

        <select onchange="mudarPainelPeriodo('tipo', this.value)">
          <option value="3" ${tipo==='3'?'selected':''}>Últimos 3 meses</option>

          <option value="12" ${tipo==='12'?'selected':''}>Últimos 12 meses</option>
          <option value="anoAtual" ${tipo==='anoAtual'?'selected':''}>Ano completo</option>
          <option value="personalizado" ${tipo==='personalizado'?'selected':''}>Período personalizado</option>
        </select>
      </div>
    </div>
    ${tipo==='personalizado'? `
    <div class="filters" style="margin-top:10px;">
      <div>
        <label style="display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">De (mês/ano)</label>

          <select onchange="mudarPainelPeriodo('mesInicio', this.value)">${MESES_PT.map((m,i)=>`<option value="${i+1}" ${pref.mesInicio===i+1?'selected':''}>${m}</option>`).join('')}</select>
          <select onchange="mudarPainelPeriodo('anoInicio', this.value)">${anos.map(a=>`<option value="${a}" ${pref.anoInicio===a?'selected':''}>${a}</option>`).join('')}</select>
        </div>
      </div>
      <div>
        <label style="display:block;font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">Até (mês/ano)</label>
        <div style="display:flex;gap:6px;">

          <select onchange="mudarPainelPeriodo('anoFim', this.value)">${anos.map(a=>`<option value="${a}" ${pref.anoFim===a?'selected':''}>${a}</option>`).join('')}</select>
        </div>
      </div>
    </div>` : ''}
  `;
}
function calcularResumoCampanha(saldosCompletos, campanhaId, mesesCampanha){
  const porColaborador = {};
  mesesCampanha.forEach(({mes,ano})=>{
    const resultados = resultadosDoMesUsandoSaldos(saldosCompletos, campanhaId, mes, ano);
    resultados.forEach(r=>{
      if(!porColaborador[r.colaborador.id]){
        porColaborador[r.colaborador.id] = { colaborador:r.colaborador, mesesParticipando:0, somaPontuacao:0, totalMateriais:0, mesesComMetaAtingida:0 };
      }
      const acc = porColaborador[r.colaborador.id];
      acc.mesesParticipando++;
      acc.somaPontuacao += r.pontuacao;
      acc.totalMateriais += r.totalMateriais;
      if(r.metaAtingida) acc.mesesComMetaAtingida++;
    });
  });
  const lista = Object.values(porColaborador).map(acc=> ({
    ...acc, mediaPontuacao: acc.mesesParticipando? acc.somaPontuacao/acc.mesesParticipando : 0
  }));
  lista.sort((a,b)=> b.mediaPontuacao-a.mediaPontuacao || b.totalMateriais-a.totalMateriais);
  return lista;
}
function ultimosMeses(n){
  const out=[]; let {mes,ano}=mesAnoAtual();
  for(let i=0;i<n;i++){ out.unshift({mes,ano}); mes--; if(mes<1){mes=12;ano--;} }
  return out;
}
function renderMiniBarChart(data){
  const max = Math.max(100, ...data.map(d=>d.media));
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px;">
    ${data.map(d=>`
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:100%;background:var(--verde-100);border-radius:6px 6px 0 0;height:${Math.max(4,(d.media/max)*80)}px;position:relative;">
          <div style="position:absolute;inset:0;background:var(--verde-500);border-radius:6px 6px 0 0;"></div>
        </div>
        <span style="font-size:10.5px;color:var(--text-muted);">${d.label}</span>
      </div>`).join('')}
  </div>`;
}
function seletorMesAno(prefix, mes, ano){
  const anos = [...new Set([ano-1,ano,ano+1])];
  return `
    <select onchange="mudarMes${cap(prefix)}(this.value,${ano})">${MESES_PT.map((m,i)=>`<option value="${i+1}" ${i+1===mes?'selected':''}>${m}</option>`).join('')}</select>
    <select onchange="mudarAno${cap(prefix)}(${mes},this.value)">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select>
  `;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  if(!exigirAdmin()) return;
  abrirModal(`

      ${icon('upload')} Escolher arquivo CSV

    </label>
    <div id="csvPreview" style="margin-top:14px;"></div>
  `);
}
function processarCsv(input){
  const file = input.files[0]; if(!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: (res)=>{
    const linhas = res.data.map(r=>{
      const keys = Object.keys(r); const get=(name)=>{ const k=keys.find(k=>k.toLowerCase().trim()===name); return k? (r[k]||'').trim() : ''; };
      return { nome:get('nome'), setor:get('setor'), cargo:get('cargo') };
    }).filter(r=>r.nome);
    if(linhas.length===0){ document.getElementById('csvPreview').innerHTML = `<div class="small-note" style="color:var(--vermelho);">Nenhum colaborador válido encontrado no arquivo.</div>`; return; }
    window._csvImportPreview = linhas;
    document.getElementById('csvPreview').innerHTML = `
      <div class="banner"><b>${linhas.length} colaborador(es) encontrados</b>Confira antes de importar.</div>
      <div class="table-wrap" style="max-height:220px;overflow-y:auto;"><table><thead><tr><th>Nome</th><th>Setor</th><th>Cargo</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr><td>${escapeHtml(l.nome)}</td><td>${escapeHtml(l.setor)}</td><td>${escapeHtml(l.cargo)}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="confirmarImportacaoCsv()">${icon('check',16)}Importar ${linhas.length} colaborador(es)</button>
    `;
  }});
}
async function confirmarImportacaoCsv(){

  const hojeIso = new Date().toISOString().slice(0,10);
  linhas.forEach(l=> STATE.colaboradores.push({id:uid(),nome:l.nome,setor:l.setor,cargo:l.cargo,status:'ativo',dataCadastro:hojeIso}));
  await salvarColaboradores();
  fecharModal(); renderApp();
}

async function salvarEntrega(id){
  const data = document.getElementById('fData').value;
  const colaboradorId = document.getElementById('fColab').value;
  const tipo = document.getElementById('fTipo').value;
  const quantidade = parseFloat(document.getElementById('fQtd').value);
  const unidadeEl = document.getElementById('fUnidade');
  const unidade = unidadeEl ? unidadeEl.value : 'unidades';
  const responsavelContagem = document.getElementById('fResp').value.trim();
  const observacoes = document.getElementById('fObs').value.trim();
  const statusValidacao = document.getElementById('fStatusValid').value;
  if(!data || !colaboradorId || !tipo || isNaN(quantidade) || quantidade<0){ alert('Preencha data, colaborador, tipo de material e uma quantidade válida.'); return; }
  const campanhaId = id? STATE.entregas.find(x=>x.id===id).campanhaId : STATE.campanhaSelecionadaId;
  const validacao = dataDentroDaCampanha(campanhaId, data);
  if(!validacao.ok){ alert(validacao.motivo); return; }
  const payload = {data,colaboradorId,tipo,quantidade,unidade,responsavelContagem,observacoes,statusValidacao,campanhaId};
  if(id){
    const idx = STATE.entregas.findIndex(x=>x.id===id);
    STATE.entregas[idx] = {...STATE.entregas[idx], ...payload};
  } else {
    STATE.entregas.push({id:uid(), criadoEm:Date.now(), ...payload});
  }
  await garantirSnapshotMetas(campanhaId, +data.slice(5,7), +data.slice(0,4));
  await salvarEntregas();
  fecharModal(); renderApp();
}

function renderSaldoTransportado(mes,ano){
  const wrap = document.getElementById('saldoTransportadoWrap');
  if(!wrap) return;
  const campanhaId = STATE.campanhaSelecionadaId;
  const chave = chaveMA(mes,ano);
  const saldos = calcularSaldosAcumulados(campanhaId, mes,ano);
  const porColaborador = {};
  const categorias = categoriasDaCampanha(campanhaPorId(campanhaId));
  STATE.colaboradores.forEach(c=>{
    categorias.forEach(cat=>{
      const s = saldos[c.id]?.[cat.key]?.[chave];
      if(s && s.carryIn > 0){
        if(!porColaborador[c.id]) porColaborador[c.id] = { colaborador:c, total:0, itens:[] };
        porColaborador[c.id].total += s.carryIn;
        porColaborador[c.id].itens.push({ categoria: cat.label.split(' (')[0], valor: s.carryIn });
      }
    });
  });
  const lista = Object.values(porColaborador).sort((a,b)=> b.total-a.total);
  if(lista.length===0){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  wrap.style.display='block';
  window._excedentesPorColaborador = lista;
  wrap.innerHTML = `
    <div class="stat-label">Excedente trazido de meses anteriores para ${nomeMes(mes)}/${ano}</div>
    <p class="small-note" style="margin:4px 0 10px 0;">Crédito que sobrou da meta batida em meses passados, já incluído automaticamente no cálculo deste mês. ${lista.length} colaborador(es) com excedente.</p>
    <div class="table-wrap">
      <table><thead><tr><th>Colaborador</th><th>Setor</th><th>Categorias com excedente</th><th>Total excedente</th><th></th></tr></thead>
      <tbody>
        ${lista.map((item,i)=>`
          <tr>
            <td style="font-weight:700;">${escapeHtml(item.colaborador.nome)}</td>
            <td>${escapeHtml(item.colaborador.setor||'—')}</td>
            <td>${item.itens.length}</td>
            <td><span class="badge badge-green">+${Math.round(item.total).toLocaleString('pt-BR')}</span></td>
            <td style="text-align:right;"><button class="btn btn-ghost btn-sm" onclick="abrirDetalhesExcedente(${i})">Ver detalhes</button></td>
          </tr>`).join('')}
      </tbody></table>
    </div>
  `;
}

function atualizarSaldoTransferencia(){
  const dataEl = document.getElementById('tData');
  const colabEl = document.getElementById('tColabOrigem');
  const catEl = document.getElementById('tCategoriaOrigem');
  const info = document.getElementById('saldoOrigemInfo');
  if(!dataEl || !colabEl || !catEl || !info) return;
  const data = dataEl.value; if(!data) return;
  const mes = +data.slice(5,7), ano = +data.slice(0,4);
  const saldo = saldoDisponivelAntes(STATE.campanhaSelecionadaId, colabEl.value, catEl.value, mes, ano);
  const cat = resolverCategoria(STATE.campanhaSelecionadaId, catEl.value);
  info.innerHTML = `Saldo disponível deste colaborador em ${escapeHtml(cat?cat.label.split(' (')[0]:'')} até ${nomeMes(mes)}/${ano}: <b>${saldo.toFixed(0)}</b> unidades equivalentes.`;
}
window.atualizarSaldoTransferencia = atualizarSaldoTransferencia;
async function salvarTransferencia(){
  const data = document.getElementById('tData').value;
  const colaboradorOrigemId = document.getElementById('tColabOrigem').value;
  const categoriaOrigem = document.getElementById('tCategoriaOrigem').value;
  const colaboradorDestinoId = document.getElementById('tColabDestino').value;
  const categoriaDestino = document.getElementById('tCategoriaDestino').value;
  const quantidade = parseFloat(document.getElementById('tQuantidade').value);
  const motivo = document.getElementById('tMotivo').value.trim();
  const erroEl = document.getElementById('transfErro');
  erroEl.style.display='none';
  if(!data || !colaboradorOrigemId || !colaboradorDestinoId || isNaN(quantidade) || quantidade<=0){
    erroEl.textContent = 'Preencha data, colaboradores e uma quantidade maior que zero.'; erroEl.style.display='block'; return;
  }
  if(colaboradorOrigemId===colaboradorDestinoId && categoriaOrigem===categoriaDestino){
    erroEl.textContent = 'Origem e destino são iguais. Escolha um colaborador ou categoria diferente para o destino.'; erroEl.style.display='block'; return;
  }
  const validacaoData = dataDentroDaCampanha(STATE.campanhaSelecionadaId, data);
  if(!validacaoData.ok){ erroEl.textContent = validacaoData.motivo; erroEl.style.display='block'; return; }
  const mes = +data.slice(5,7), ano = +data.slice(0,4);
  const campanhaId = STATE.campanhaSelecionadaId;
  const saldoAtual = saldoDisponivelAntes(campanhaId, colaboradorOrigemId, categoriaOrigem, mes, ano);
  if(quantidade > saldoAtual){
    erroEl.textContent = `Quantidade maior que o saldo disponível na origem (${saldoAtual.toFixed(0)} unidades equivalentes até este mês).`; erroEl.style.display='block'; return;
  }
  STATE.transferencias.push({
    id:uid(), campanhaId, data, colaboradorOrigemId, categoriaOrigem, colaboradorDestinoId, categoriaDestino,
    quantidade, motivo, criadoEm:Date.now()
  });
  await garantirSnapshotMetas(campanhaId, mes,ano);
  await salvarTransferencias();
  fecharModal(); renderApp();
}

function montarMensagemTop3(mes,ano){
  const resultados = calcularResultadosMes(STATE.campanhaSelecionadaId, mes,ano);
  const top3 = resultados.filter(r=> r.pontuacao>0 || r.totalMateriais>0).slice(0,3);
  const medalhas = ['🥇 1º lugar','🥈 2º lugar','🥉 3º lugar'];
  let msg = `♻️ RANKING RECICLAR É CUIDAR DA CASA COMUM\n`;
  msg += `APAC DE IMPERATRIZ\n\n`;
  msg += `Resultado do mês: ${nomeMes(mes)} de ${ano}\n\n`;
  msg += `🏆 TOP 3 COLABORADORES\n\n`;
  top3.forEach((r,i)=>{
    msg += `${medalhas[i]}: ${r.colaborador.nome}\nPontuação: ${r.pontuacao.toFixed(0)} pontos\nMeta atingida: ${r.mediaReal.toFixed(0)}%\n\n`;
  });
  const totalMateriais = resultados.reduce((a,r)=>a+r.totalMateriais,0);

  msg += `📊 RESULTADO GERAL\n\n`;

  msg += `Colaboradores que atingiram a meta: ${atingiramMeta}\n`;

  return msg;
}
function montarMensagemCompleta(mes,ano){
  const resultados = calcularResultadosMes(STATE.campanhaSelecionadaId, mes,ano);
  const comPosicao = resultados.filter(r=>r.posicao);
  const semPosicao = resultados.filter(r=>!r.posicao);
  let msg = `♻️ RANKING COMPLETO — RECICLAR É CUIDAR DA CASA COMUM\nAPAC DE IMPERATRIZ\n${nomeMes(mes)} de ${ano}\n\n`;
  comPosicao.forEach(r=>{ msg += `${r.posicao}º — ${r.colaborador.nome}: ${r.pontuacao.toFixed(0)} pontos (${r.mediaReal.toFixed(0)}% da meta)\n`; });
  if(semPosicao.length){ msg += `\nAinda sem entregas pontuadas neste mês: ${semPosicao.map(r=>r.colaborador.nome).join(', ')}\n`; }

}

/* ---------- CARD PNG PARA WHATSAPP ---------- */
function gerarCardRanking(mes,ano){
  const resultados = calcularResultadosMes(STATE.campanhaSelecionadaId, mes,ano);
  const top3 = resultados.filter(r=> r.pontuacao>0 || r.totalMateriais>0).slice(0,3);
  const W=1080,H=1350;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#173B27'); grad.addColorStop(1,'#0D2116');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  // leaf watermark circle
  ctx.globalAlpha=0.08; ctx.fillStyle='#8FCB9E'; ctx.beginPath(); ctx.arc(W-120,160,260,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;

  ctx.textAlign='center';
  ctx.fillStyle='#8FCB9E'; ctx.font='600 34px Georgia, serif'; ctx.fillText('♻️ RECICLAR É CUIDAR', W/2, 120);
  ctx.fillText('DA CASA COMUM', W/2, 165);
  ctx.fillStyle='#DCEBDF'; ctx.font='500 26px Georgia, serif'; ctx.fillText('APAC de Imperatriz — Maranhão', W/2, 210);
  ctx.fillStyle='#B9CDC0'; ctx.font='400 24px Arial'; ctx.fillText(`Resultado do mês: ${nomeMes(mes)} de ${ano}`, W/2, 250);

  ctx.fillStyle='#ffffff'; ctx.font='700 36px Georgia, serif'; ctx.fillText('🏆 TOP 3 COLABORADORES', W/2, 340);

  const medalColors = ['#C08A22','#9AA6AE','#B0703F'];
  const medals = ['🥇','🥈','🥉'];
  let y = 420;
  top3.forEach((r,i)=>{
    ctx.fillStyle='rgba(255,255,255,0.06)';
    roundRect(ctx,90,y-50,W-180,120,18); ctx.fill();
    ctx.strokeStyle=medalColors[i]; ctx.lineWidth=3; roundRect(ctx,90,y-50,W-180,120,18); ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle='#ffffff'; ctx.font='44px Arial'; ctx.fillText(medals[i], 120, y+20);
    ctx.font='700 32px Georgia, serif'; ctx.fillText(truncar(r.colaborador.nome,26), 200, y-5);
    ctx.font='400 24px Arial'; ctx.fillStyle='#C9DCCE';
    ctx.fillText(`${r.pontuacao.toFixed(0)} pontos · Meta atingida: ${r.mediaReal.toFixed(0)}%`, 200, y+35);
    y += 150;
  });

  const totalMateriais = resultados.reduce((a,r)=>a+r.totalMateriais,0);
  const atingiramMeta = resultados.filter(r=>r.metaAtingida).length;
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff'; ctx.font='700 32px Georgia, serif'; ctx.fillText('📊 RESULTADO GERAL', W/2, y+40);
  ctx.font='400 26px Arial'; ctx.fillStyle='#DCEBDF';
  ctx.fillText(`Participantes: ${resultados.length}   ·   Atingiram a meta: ${atingiramMeta}`, W/2, y+90);
  ctx.fillText(`Total arrecadado: ${totalMateriais.toLocaleString('pt-BR')} unidades`, W/2, y+130);

  ctx.font='italic 28px Georgia, serif'; ctx.fillStyle='#8FCB9E';
  wrapText(ctx,'🌱 Parabéns a todos que contribuíram com a campanha!', W/2, y+210, W-160, 36);

  canvas.toBlob(async (blob)=>{
    const url = URL.createObjectURL(blob);
    const fname = `ranking-${nomeMes(mes)}-${ano}.png`;
    if(navigator.canShare && navigator.canShare({files:[new File([blob],fname,{type:'image/png'})]})){
      try{ await navigator.share({files:[new File([blob],fname,{type:'image/png'})], title:'Ranking Reciclar é Cuidar da Casa Comum'}); return; }catch(e){}
    }
    const a = document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    abrirModal(`<div class="modal-head"><h3>Card gerado</h3><button class="modal-close" onclick="fecharModal()">${icon('x')}</button></div>
      <img src="${url}" style="width:100%;border-radius:12px;border:1px solid var(--border);">
      <p class="small-note" style="margin-top:10px;">A imagem foi baixada para o seu aparelho. Abra o WhatsApp e anexe o arquivo para compartilhar.</p>`);
  }, 'image/png');
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function truncar(s,n){ return s.length>n? s.slice(0,n-1)+'…' : s; }
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words = text.split(' '); let line=''; let lines=[];
  words.forEach(w=>{ const test=line+w+' '; if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w+' '; } else line=test; });
  lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, y+i*lineHeight));
}

  return `

      <div class="toolbar-right"><button class="btn btn-outline" onclick="exportarCsvEntregas(${mes},${ano})">${icon('download')}Exportar entregas (CSV)</button></div>
    </div>
    ${meses.length===0? `<div class="card"><div class="empty-state">Nenhum histórico registrado ainda nesta campanha.</div></div>` : `
    <div class="section-title">Ranking de ${nomeMes(mes)} de ${ano}</div>

    <div class="card" style="padding:0;"><div class="table-wrap">${renderTabelaEntregasHistorico(mes,ano)}</div></div>
    `}
  `;
}
function renderTabelaEntregasHistorico(mes,ano){
  const campanhaId = STATE.campanhaSelecionadaId;
  const chave = chaveMA(mes,ano);
  const lista = STATE.entregas.filter(e=>e.campanhaId===campanhaId && e.data && e.data.slice(0,7)===chave).sort((a,b)=>b.data.localeCompare(a.data));
  if(lista.length===0) return `<div class="table-empty">Nenhuma entrega neste mês.</div>`;
  return `<table><thead><tr><th>Data</th><th>Colaborador</th><th>Material</th><th>Qtd.</th><th>Status</th></tr></thead>
    <tbody>${lista.map(e=>{
      const c = STATE.colaboradores.find(x=>x.id===e.colaboradorId);
      const cat = resolverCategoria(campanhaId, e.tipo);
      return `<tr><td>${formatarData(e.data)}</td><td>${escapeHtml(c?c.nome:'(removido)')}</td><td>${cat?escapeHtml(cat.label.split(' (')[0]):'Outros'}</td><td>${e.quantidade}</td><td>${e.statusValidacao==='validado'?'<span class="badge badge-green">Validado</span>':'<span class="badge badge-amber">Pendente</span>'}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function baixarArquivo(conteudo, nome, tipo){
  const blob = new Blob([conteudo],{type:tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
function exportarCsvEntregas(mes,ano){
  const campanhaId = STATE.campanhaSelecionadaId;
  const chave = chaveMA(mes,ano);
  const lista = STATE.entregas.filter(e=>e.campanhaId===campanhaId && e.data && e.data.slice(0,7)===chave);
  let csv = 'Data,Colaborador,Setor,Material,Quantidade,Unidade,Status,ResponsavelContagem,Observacoes\n';
  lista.forEach(e=>{
    const c = STATE.colaboradores.find(x=>x.id===e.colaboradorId);
    const cat = resolverCategoria(campanhaId, e.tipo);
    const linha = [e.data, c?c.nome:'', c?c.setor:'', cat?cat.label:'Outros', e.quantidade, e.unidade, e.statusValidacao, e.responsavelContagem||'', (e.observacoes||'').replace(/,/g,';')];
    csv += linha.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  baixarArquivo(csv, `entregas-${nomeMes(mes)}-${ano}.csv`, 'text/csv;charset=utf-8;');
}
window.exportarCsvEntregas = exportarCsvEntregas;

async function salvarCampanha(id){
  const nome = document.getElementById('cpNome').value.trim();
  const dataInicio = document.getElementById('cpDataInicio').value;
  const dataFim = document.getElementById('cpDataFim').value;
  const status = document.getElementById('cpStatus').value;
  const erroEl = document.getElementById('campanhaErro');
  erroEl.style.display='none';
  if(!nome){ erroEl.textContent='Informe o nome da campanha.'; erroEl.style.display='block'; return; }
  if(!dataInicio){ erroEl.textContent='Informe a data de início.'; erroEl.style.display='block'; return; }
  const mesInicio = +dataInicio.slice(5,7), anoInicio = +dataInicio.slice(0,4);
  let mesFim=null, anoFim=null;
  if(dataFim){
    mesFim = +dataFim.slice(5,7); anoFim = +dataFim.slice(0,4);
    if(anoFim*12+mesFim < anoInicio*12+mesInicio){ erroEl.textContent='A data de encerramento não pode ser antes da data de início.'; erroEl.style.display='block'; return; }
  }
  const metasDefault = {};
  const nomesPersonalizados = {};
  const categoriasDesativadas = [];
  CATEGORIAS.forEach(cat=>{
    const ativo = document.getElementById('cpUsar_'+cat.key).checked;
    if(!ativo) categoriasDesativadas.push(cat.key);
    metasDefault[cat.key] = parseFloat(document.getElementById('cpMeta_'+cat.key).value) || cat.metaDefault;
    const nomeDigitado = document.getElementById('cpNomeCat_'+cat.key).value.trim();
    if(nomeDigitado && nomeDigitado!==cat.label) nomesPersonalizados[cat.key] = nomeDigitado;
  });
  const materiaisExtras = [];
  (window._materiaisExtrasForm||[]).forEach(item=>{
    const nomeEl = document.getElementById('extraNome_'+item.key);
    if(!nomeEl) return; // linha removida da tela
    const label = nomeEl.value.trim();
    if(!label) return; // ignora linhas deixadas em branco
    const metaDefault = parseFloat(document.getElementById('extraMeta_'+item.key).value) || 0;
    const unidade = document.getElementById('extraUnidade_'+item.key).value.trim() || 'unidades';
    materiaisExtras.push({ key: item.key, label, metaDefault, unidade });
    metasDefault[item.key] = metaDefault;
  });
  const totalAtivos = (CATEGORIAS.length - categoriasDesativadas.length) + materiaisExtras.length;
  const avisoEl = document.getElementById('avisoSemMateriais');
  if(totalAtivos===0){ avisoEl.style.display='block'; erroEl.textContent='Pelo menos um material precisa ficar ativo nesta campanha.'; erroEl.style.display='block'; return; }
  avisoEl.style.display='none';
  if(id){
    const c = STATE.campanhas.find(x=>x.id===id);
    Object.assign(c, {nome, mesInicio, anoInicio, mesFim, anoFim, status, metasDefault, nomesPersonalizados, materiaisExtras, categoriasDesativadas});
  } else {
    STATE.campanhas.push({ id:uid(), nome, mesInicio, anoInicio, mesFim, anoFim, status, metasDefault, metasHistorico:{}, nomesPersonalizados, materiaisExtras, categoriasDesativadas });
  }
  await salvarCampanhas();
  if(!STATE.campanhaSelecionadaId) STATE.campanhaSelecionadaId = STATE.campanhas[STATE.campanhas.length-1].id;
  fecharModal(); renderApp();
}

  if(campanhaTemEntregas(id)){

      <p>A campanha <b>${escapeHtml(c.nome)}</b> já tem entregas registradas no seu período. Para preservar o histórico, marque-a como "Encerrada" em vez de excluir.</p>

    <p>Tem certeza que deseja excluir a campanha <b>${escapeHtml(c.nome)}</b>? Essa ação não pode ser desfeita.</p>

  const wrap = document.getElementById('tabelaCampanhasWrap');
  if(!wrap) return;
  const filtro = document.getElementById('filtroStatusCampanha')?.value || '';
  const lista = campanhasOrdenadas().filter(c=> !filtro || c.status===filtro);
  if(lista.length===0){ wrap.innerHTML = `<div class="table-empty">Nenhuma campanha ${filtro?'com esse status':'cadastrada'} ainda.</div>`; return; }
  wrap.innerHTML = `
    <table><thead><tr><th>Nome</th><th>Início</th><th>Fim</th><th>Status</th><th></th></tr></thead>
    <tbody>
      ${lista.map(c=>`
        <tr>
          <td style="font-weight:700;">${escapeHtml(c.nome)}</td>
          <td>${nomeMes(c.mesInicio)}/${c.anoInicio}</td>
          <td>${c.anoFim? nomeMes(c.mesFim)+'/'+c.anoFim : 'Em andamento'}</td>
          <td>${c.status==='ativa'?'<span class="badge badge-green">Ativa</span>':c.status==='encerrada'?'<span class="badge badge-grey">Encerrada</span>':'<span class="badge badge-amber">Planejada</span>'}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-ghost btn-sm" onclick="abrirFormCampanha('${c.id}')">${icon('edit',16)}</button>
            <button class="btn btn-ghost btn-sm" onclick="confirmarExcluirCampanha('${c.id}')" style="color:var(--vermelho);">${icon('trash',16)}</button>
          </td>
        </tr>`).join('')}
    </tbody></table>
  `;
}
window.renderTabelaCampanhas = renderTabelaCampanhas;
async function alterarSenhaAdmin(){
  if(!exigirAdmin()) return;
  const v = document.getElementById('novaSenhaAdmin').value.trim();
  if(!v){ alert('Informe uma nova senha.'); return; }
  STATE.config.senhaAdmin = v;
  await salvarConfig();
  alert('Senha atualizada.');
  renderApp();
}
async function apagarDadosTeste(){
  if(!exigirAdmin()) return;
  if(!confirm('Isso vai apagar TODOS os colaboradores e entregas cadastrados atualmente (dados de teste). Deseja continuar?')) return;
  STATE.colaboradores = []; STATE.entregas = [];
  STATE.config.temDadosTeste = false;
  await salvarColaboradores(); await salvarEntregas(); await salvarConfig();
  renderApp();
}
window.alterarSenhaAdmin=alterarSenhaAdmin; window.apagarDadosTeste=apagarDadosTeste;

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
async function iniciar(){
  await detectarModoArmazenamento();
  await carregarDados();
  if(sessionStorage.getItem('reciclar-apac:isAdmin')==='1'){
    STATE.isAdmin = true;
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderApp();
  // pós-render: preencher tabelas filtráveis que dependem de elementos já no DOM
  if(STATE.view==='colaboradores') renderTabelaColaboradores();
  if(STATE.view==='entregas') renderTabelaEntregas();
  if(STATE.view==='config') renderTabelaCampanhas();
}
const _origRenderApp = renderApp;
renderApp = function(){
  _origRenderApp();
  if(STATE.view==='colaboradores') setTimeout(renderTabelaColaboradores,0);
  if(STATE.view==='entregas') setTimeout(renderTabelaEntregas,0);
  if(STATE.view==='config') setTimeout(renderTabelaCampanhas,0);
};
iniciar();
</script>
