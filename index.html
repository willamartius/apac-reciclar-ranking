<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reciclar é Cuidar da Casa Comum — APAC Imperatriz</title>
<link rel="manifest" id="manifestLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root{
  --verde-900:#12301F;
  --verde-800:#173B27;
  --verde-700:#1F5D3F;
  --verde-600:#2C7350;
  --verde-500:#3E8E5A;
  --verde-300:#8FCB9E;
  --verde-100:#E4F1E6;
  --ouro:#C08A22;
  --prata:#8A97A0;
  --bronze:#B0703F;
  --bg:#F5F8F4;
  --card:#FFFFFF;
  --border:#DFE7E0;
  --text:#182420;
  --text-muted:#5E6E64;
  --vermelho:#AE4430;
  --sombra: 0 2px 10px rgba(18,48,31,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:var(--verde-700);}
::selection{background:var(--verde-300);}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:252px;flex-shrink:0;background:var(--verde-900);color:#fff;
  display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px 6px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:16px;}
.brand-leaf{width:34px;height:34px;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-title{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:#fff;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--verde-300);margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav button{
  display:flex;align-items:center;gap:11px;background:none;border:none;color:#D9E8DD;
  text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:600;
  transition:background .15s;
}
.nav button svg{width:18px;height:18px;flex-shrink:0;opacity:.9;}
.nav button:hover{background:rgba(255,255,255,0.06);}
.nav button.active{background:var(--verde-700);color:#fff;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,0.12);padding-top:14px;margin-top:10px;}
.admin-pill{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;color:var(--verde-300);
}
.admin-pill button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;}
.topbar .desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.help-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#fff;
  color:var(--verde-700);font-weight:800;font-size:15px;flex-shrink:0;
}
.content{padding:22px 26px 90px 26px;max-width:1180px;width:100%;}

/* Mobile bottom nav */
.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;background:var(--verde-900);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;z-index:30;
  box-shadow:0 -2px 12px rgba(0,0,0,.18);
}
.bottomnav-row{display:flex;justify-content:space-around;}
.bottomnav button{
  background:none;border:none;color:#B9CDC0;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:10.5px;font-weight:700;padding:5px 4px;border-radius:10px;flex:1;
}
.bottomnav button svg{width:20px;height:20px;}
.bottomnav button.active{color:#fff;}
.bottomnav button.active svg{filter:drop-shadow(0 0 6px rgba(143,203,158,.6));}

/* ---------- CARDS / GENERIC ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--sombra);}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:920px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--verde-800);}
.stat-value.small{font-size:18px;}
.stat-sub{font-size:12px;color:var(--text-muted);}

.section-title{font-size:16px;font-weight:700;margin:26px 0 12px 0;color:var(--verde-900);}
.section-title:first-child{margin-top:0;}

.btn{
  border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;
  display:inline-flex;align-items:center;gap:7px;transition:opacity .15s;
}
.btn:active{opacity:.8;}
.btn-primary{background:var(--verde-700);color:#fff;}
.btn-primary:hover{background:var(--verde-600);}
.btn-outline{background:#fff;border:1.5px solid var(--verde-700);color:var(--verde-700);}
.btn-outline:hover{background:var(--verde-100);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:#fff;border:1.5px solid var(--vermelho);color:var(--vermelho);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
.toolbar-left,.toolbar-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--text);
  background:#fff;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde-300);border-color:var(--verde-500);}
label{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:5px;}
.field{margin-bottom:13px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);
  padding:9px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:12px;}
.table-empty{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:800;}
.badge-green{background:var(--verde-100);color:var(--verde-700);}
.badge-amber{background:#FBF0DC;color:var(--ouro);}
.badge-red{background:#F7E5E0;color:var(--vermelho);}
.badge-grey{background:#EEF1EF;color:var(--text-muted);}

.progress{background:#EAF0EA;border-radius:8px;height:8px;overflow:hidden;}
.progress > div{height:100%;background:var(--verde-500);border-radius:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(18,30,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:720px){.modal-overlay{align-items:center;}}
.modal{background:#fff;border-radius:18px 18px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:22px;}
@media(min-width:720px){.modal{border-radius:16px;}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);line-height:1;padding:2px 6px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .icon{width:44px;height:44px;color:var(--verde-300);margin-bottom:10px;}

.podium-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:18px;}
.podium-card{border-radius:14px;padding:16px 10px;text-align:center;color:#fff;}
.podium-1{background:linear-gradient(160deg,#C08A22,#9C6E17);order:2;padding-top:22px;}
.podium-2{background:linear-gradient(160deg,#9AA6AE,#727C82);order:1;}
.podium-3{background:linear-gradient(160deg,#B0703F,#8A5630);order:3;}
.podium-medal{font-size:22px;}
.podium-name{font-weight:800;font-size:13.5px;margin-top:4px;}
.podium-score{font-family:'Fraunces',serif;font-size:20px;margin-top:2px;}
@media(max-width:600px){.podium-wrap{grid-template-columns:1fr;}
  .podium-1,.podium-2,.podium-3{order:0;padding-top:16px;}}

.filters{display:flex;flex-wrap:wrap;gap:10px;}
.filters > div{min-width:130px;flex:1;}

.banner{background:var(--verde-100);border:1px solid var(--verde-300);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--verde-800);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
.banner.amber{background:#FBF0DC;border-color:#E9CE94;color:#7A5A0F;}
.banner b{display:block;margin-bottom:2px;}

.sig-row{display:flex;flex-wrap:wrap;gap:10px;}
.sig-chip{flex:1;min-width:150px;border:1.5px solid var(--border);border-radius:10px;padding:9px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
.sig-chip.on{border-color:var(--verde-500);background:var(--verde-100);color:var(--verde-800);}
.sig-chip .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}
.sig-chip.on .dot{background:var(--verde-500);border-color:var(--verde-500);}

.loading-screen{position:fixed;inset:0;background:var(--verde-900);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:10px;z-index:999;}

.checklist{font-size:13.5px;line-height:1.9;padding-left:20px;color:var(--text);}
.checklist li{margin-bottom:4px;}

.small-note{font-size:12px;color:var(--text-muted);}

.tag-input-btn{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--border);border-radius:10px;padding:12px;color:var(--text-muted);font-size:13px;font-weight:700;}

@media(max-width:920px){
  .sidebar{display:none;}
  .content{padding:16px 14px 96px 14px;}
  .topbar{padding:14px 16px;}
  .bottomnav{display:block;}
}
</style>

<div id="loading" class="loading-screen">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8FCB9E" stroke-width="1.8"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
  <div class="serif" style="font-size:15px;">Carregando o ranking…</div>
</div>

<div id="app" style="display:none;"></div>

<script>
/* =========================================================
   RECICLAR É CUIDAR DA CASA COMUM — APAC IMPERATRIZ
   Aplicativo de ranking de arrecadação de recicláveis
   ========================================================= */

/* ---------- CONSTANTES DO REGULAMENTO ---------- */
const CATEGORIAS = [
  { key:'latinhas',  label:'Latinhas (refrigerante, cerveja, energético)', metaDefault:150, unidade:'unidades', aceitaKg:true, unidadesPorKg:75 },
  { key:'pet',       label:'Garrafas PET',                                  metaDefault:250, unidade:'unidades' },
  { key:'embalagens',label:'Embalagens plásticas (arroz, açúcar, leite, sal, fardos)', metaDefault:100, unidade:'unidades' },
  { key:'papelao',   label:'Caixas de papelão',                             metaDefault:100, unidade:'unidades' },
  { key:'latas',     label:'Latas em geral (sardinha, leite, kitut, feijoada)', metaDefault:80, unidade:'unidades' },
  { key:'ovos',      label:'Cartelas de ovos (30 unidades)',                metaDefault:25,  unidade:'cartelas' },
];
const TIPO_OUTROS = 'outros';
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATEGORIA_MAP = Object.fromEntries(CATEGORIAS.map(c=>[c.key,c]));

/* ---------- ESTADO ---------- */
let STATE = {
  colaboradores: [],
  entregas: [],
  transferencias: [],
  config: null,
  isAdmin: false,
  view: 'dashboard',
  dashMes: null, dashAno: null,
  rankMes: null, rankAno: null, rankSetor: '',
  histMes: null, histAno: null,
};
/* ---------- HELPERS DE ARMAZENAMENTO ---------- */
/* Este app funciona em dois ambientes:
   1) Dentro do Claude (como artefato) -> usa window.storage automaticamente.
   2) Hospedado fora (ex: GitHub Pages) -> usa o banco Firebase configurado abaixo em
      FIREBASE_CONFIG. Essa configuração é pública por natureza (é assim que todo app
      Firebase funciona) e não controla quem pode editar dados — quem controla isso é a
      senha de administrador do próprio app, mais abaixo.
   Se nenhum dos dois estiver disponível, o app usa o armazenamento local do navegador
   como último recurso, só para não travar, mas nesse caso os dados não são compartilhados. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDMpYOJrypaiE05HUoHNERSZTBhwj2Vouo",
  authDomain: "apac-reciclar.firebaseapp.com",
  projectId: "apac-reciclar",
  storageBucket: "apac-reciclar.firebasestorage.app",
  messagingSenderId: "309128467158",
  appId: "1:309128467158:web:a3a1c14fed86b00020ef77"
};

let FIREBASE_DB = null;
let STORAGE_MODE = 'none';

function inicializarFirebase(config){
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    FIREBASE_DB = firebase.firestore();
    return true;
  }catch(e){ console.error('Erro ao iniciar Firebase', e); return false; }
}
async function detectarModoArmazenamento(){
  if(window.storage){ STORAGE_MODE='claude'; return; }
  if(FIREBASE_CONFIG && typeof firebase!=='undefined' && inicializarFirebase(FIREBASE_CONFIG)){ STORAGE_MODE='firestore'; return; }
  STORAGE_MODE='local';
}
async function storageGet(key, fallback){
  try{
    if(STORAGE_MODE==='claude'){
      const r = await window.storage.get(key, true);
      return r && r.value !== undefined ? JSON.parse(r.value) : fallback;
    }
    if(STORAGE_MODE==='firestore'){
      const doc = await FIREBASE_DB.collection('reciclar-apac').doc(key).get();
      return doc.exists && doc.data().value !== undefined ? JSON.parse(doc.data().value) : fallback;
    }
    const raw = localStorage.getItem('reciclar-apac:'+key);
    return raw!==null ? JSON.parse(raw) : fallback;
  }catch(e){ console.error('Erro ao carregar', key, e); return fallback; }
}
async function storageSet(key, value){
  try{
    if(STORAGE_MODE==='claude'){ await window.storage.set(key, JSON.stringify(value), true); return true; }
    if(STORAGE_MODE==='firestore'){ await FIREBASE_DB.collection('reciclar-apac').doc(key).set({value: JSON.stringify(value)}); return true; }
    localStorage.setItem('reciclar-apac:'+key, JSON.stringify(value)); return true;
  }catch(e){ console.error('Erro ao salvar', key, e); return false; }
}
function defaultConfig(){
  return {
    senhaAdmin: '1234',
    metasDefault: Object.fromEntries(CATEGORIAS.map(c=>[c.key,c.metaDefault])),
    metasHistorico: {},
    temDadosTeste: true,
    janelaPainelMeses: 6, // quantos meses mostrar no painel (número) ou 'campanha' para desde o início
  };
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hoje(){ return new Date(); }
function mesAnoAtual(){ const d=hoje(); return {mes:d.getMonth()+1, ano:d.getFullYear()}; }
function chaveMA(mes,ano){ return ano+'-'+String(mes).padStart(2,'0'); }
function nomeMes(mes){ return MESES_PT[mes-1]; }

/* ---------- DADOS FICTÍCIOS DE DEMONSTRAÇÃO ---------- */
function gerarDadosTeste(){
  const {mes,ano} = mesAnoAtual();
  const setores = ['Administrativo','Marcenaria','Costura','Cozinha','Horta'];
  const nomes = ['Antônio Souza','Maria Aparecida Lima','José Carlos Ferreira','Francisca Nascimento','Raimundo Pereira','Luzia Costa','Pedro Henrique Alves','Cícera Santos'];
  const colaboradores = nomes.map((n,i)=>({
    id: uid(), nome:n, setor:setores[i%setores.length], cargo:'Colaborador(a)',
    status:'ativo', dataCadastro: new Date(ano,mes-2,10).toISOString().slice(0,10)
  }));
  const entregas = [];
  colaboradores.forEach((c,i)=>{
    const fator = [1.1,0.6,0.95,0.4,1.3,0.7,1.0,0.5][i%8];
    CATEGORIAS.forEach(cat=>{
      const base = cat.metaDefault*fator*(0.7+Math.random()*0.5);
      entregas.push({
        id: uid(), data:new Date(ano,mes-1,8+ (i%15)).toISOString().slice(0,10),
        colaboradorId:c.id, tipo:cat.key,
        quantidade: Math.max(1, Math.round(cat.key==='latinhas'&&cat.aceitaKg? base/cat.unidadesPorKg*10 : base)),
        unidade: cat.key==='latinhas' ? 'kg-x10' : 'unidades',
        observacoes:'', responsavelContagem:'Encarregada Financeira',
        statusValidacao:'validado',
        criadoEm:Date.now()
      });
    });
  });
  return {colaboradores, entregas};
}
// nota: para simplificar a quantidade fictícia de latinhas, usamos "kg-x10" (décimos de kg) só nos dados de teste;
// no registro real de entregas, latinhas usa 'kg' ou 'unidades' normalmente (ver normalizarQuantidade).

/* ---------- CARREGAMENTO INICIAL ---------- */
const CAMPANHA_INICIO = { mes: 5, ano: 2026 }; // a campanha e o acompanhamento acumulado começam em maio de 2026
async function carregarDados(){
  STATE.colaboradores = await storageGet('colaboradores', []);
  STATE.entregas = await storageGet('entregas', []);
  STATE.transferencias = await storageGet('transferencias', []);
  STATE.config = await storageGet('config', null);
  if(!STATE.config){
    STATE.config = defaultConfig();
    if(STATE.colaboradores.length===0 && STATE.entregas.length===0){
      const demo = gerarDadosTeste();
      STATE.colaboradores = demo.colaboradores;
      STATE.entregas = demo.entregas;
      await storageSet('colaboradores', STATE.colaboradores);
      await storageSet('entregas', STATE.entregas);
    }
    await storageSet('config', STATE.config);
  }
  if(STATE.config.janelaPainelMeses===undefined) STATE.config.janelaPainelMeses = 6;
  const {mes,ano} = mesAnoAtual();
  STATE.dashMes=mes; STATE.dashAno=ano;
  STATE.rankMes=mes; STATE.rankAno=ano;
  STATE.histMes=mes; STATE.histAno=ano;
}
async function salvarColaboradores(){ await storageSet('colaboradores', STATE.colaboradores); }
async function salvarEntregas(){ await storageSet('entregas', STATE.entregas); }
async function salvarTransferencias(){ await storageSet('transferencias', STATE.transferencias); }
async function salvarConfig(){ await storageSet('config', STATE.config); }

/* ---------- LÓGICA DE NEGÓCIO ---------- */
function normalizarQuantidadeUnidades(entrega){
  const cat = CATEGORIA_MAP[entrega.tipo];
  if(!cat) return 0;
  if(entrega.tipo==='latinhas'){
    if(entrega.unidade==='kg') return entrega.quantidade * cat.unidadesPorKg;
    if(entrega.unidade==='kg-x10') return (entrega.quantidade/10) * cat.unidadesPorKg;
    return entrega.quantidade;
  }
  return entrega.quantidade;
}
function getMetasDoMes(mes,ano){
  const chave = chaveMA(mes,ano);
  if(STATE.config.metasHistorico[chave]) return STATE.config.metasHistorico[chave];
  return STATE.config.metasDefault;
}
async function garantirSnapshotMetas(mes,ano){
  const chave = chaveMA(mes,ano);
  if(!STATE.config.metasHistorico[chave]){
    STATE.config.metasHistorico[chave] = {...STATE.config.metasDefault};
    await salvarConfig();
  }
}
function entregasValidadasDoMes(mes,ano){
  const chave = chaveMA(mes,ano);
  return STATE.entregas.filter(e=>e.statusValidacao==='validado' && e.data && e.data.slice(0,7)===chave);
}
function transferenciasDoMes(mes,ano){
  const chave = chaveMA(mes,ano);
  return STATE.transferencias.filter(t=>t.data && t.data.slice(0,7)===chave);
}
function mesAnteriorDe(mes,ano){
  let m=mes-1, a=ano;
  if(m<1){ m=12; a--; }
  if(a<CAMPANHA_INICIO.ano || (a===CAMPANHA_INICIO.ano && m<CAMPANHA_INICIO.mes)) return null;
  return {mes:m, ano:a};
}
function todosMesesDesdeCampanhaAte(mesAlvo,anoAlvo){
  const lista = [];
  let m=CAMPANHA_INICIO.mes, a=CAMPANHA_INICIO.ano;
  // se o mês alvo for anterior ao início da campanha, considera só ele mesmo (evita lista vazia)
  if(anoAlvo<a || (anoAlvo===a && mesAlvo<m)) return [{mes:mesAlvo,ano:anoAlvo}];
  while(a<anoAlvo || (a===anoAlvo && m<=mesAlvo)){
    lista.push({mes:m,ano:a});
    m++; if(m>12){ m=1; a++; }
  }
  return lista;
}
/* Janela de exibição do painel (não afeta o cálculo do excedente, só o que é mostrado
   no gráfico de evolução e no resumo de acompanhamento). Padrão: últimos 6 meses.
   O admin pode trocar para 3, 12, ou "desde o início da campanha" em maio/2026. */
function mesesJanelaPainel(mesAlvo,anoAlvo){
  const todos = todosMesesDesdeCampanhaAte(mesAlvo,anoAlvo);
  const janela = STATE.config.janelaPainelMeses;
  if(janela==='campanha') return todos;
  const n = parseInt(janela,10) || 6;
  return todos.slice(-n);
}
async function mudarJanelaPainel(valor){
  if(!exigirAdmin()){ renderApp(); return; }
  STATE.config.janelaPainelMeses = valor==='campanha' ? 'campanha' : parseInt(valor,10);
  await salvarConfig();
  renderApp();
}
window.mudarJanelaPainel = mudarJanelaPainel;
/* Calcula, para cada colaborador e categoria, o saldo mês a mês desde o início da campanha
   até o mês alvo, já considerando: entregas validadas, transferências recebidas/enviadas, e
   o excedente (o que passou da meta) transportado automaticamente para o mês seguinte. */
function calcularSaldosAcumulados(mesAlvo,anoAlvo){
  const meses = todosMesesDesdeCampanhaAte(mesAlvo,anoAlvo);
  const saldos = {};
  STATE.colaboradores.forEach(c=>{ saldos[c.id]={}; CATEGORIAS.forEach(cat=> saldos[c.id][cat.key]={}); });
  meses.forEach(({mes,ano})=>{
    const chave = chaveMA(mes,ano);
    const metas = getMetasDoMes(mes,ano);
    const entregas = entregasValidadasDoMes(mes,ano);
    const transferencias = transferenciasDoMes(mes,ano);
    const anterior = mesAnteriorDe(mes,ano);
    const chaveAnterior = anterior? chaveMA(anterior.mes,anterior.ano) : null;
    STATE.colaboradores.forEach(c=>{
      CATEGORIAS.forEach(cat=>{
        let creditos = 0;
        entregas.filter(e=>e.colaboradorId===c.id && e.tipo===cat.key).forEach(e=> creditos += normalizarQuantidadeUnidades(e));
        transferencias.filter(t=>t.colaboradorDestinoId===c.id && t.categoriaDestino===cat.key).forEach(t=> creditos += t.quantidade);
        transferencias.filter(t=>t.colaboradorOrigemId===c.id && t.categoriaOrigem===cat.key).forEach(t=> creditos -= t.quantidade);
        const carryIn = chaveAnterior && saldos[c.id][cat.key][chaveAnterior] ? saldos[c.id][cat.key][chaveAnterior].leftover : 0;
        const meta = metas[cat.key] || cat.metaDefault;
        const totalDisponivel = creditos + carryIn;
        const leftover = Math.max(0, totalDisponivel - meta);
        saldos[c.id][cat.key][chave] = { creditos, carryIn, totalDisponivel, leftover, meta };
      });
    });
  });
  return saldos;
}
function saldoDisponivelAntes(colaboradorId, categoria, mes, ano){
  const saldos = calcularSaldosAcumulados(mes,ano);
  const s = saldos[colaboradorId]?.[categoria]?.[chaveMA(mes,ano)];
  return s? s.totalDisponivel : 0;
}
function resultadosDoMesUsandoSaldos(saldos, mes, ano, setorFiltro){
  const chave = chaveMA(mes,ano);
  let colaboradores = STATE.colaboradores.filter(c=> !setorFiltro || c.setor===setorFiltro);
  colaboradores = colaboradores.filter(c=> !c.dataCadastro || c.dataCadastro.slice(0,7) <= chave);
  const resultados = colaboradores.map(c=>{
    const totais = {}, percentuais = {}, frescos = {};
    CATEGORIAS.forEach(cat=>{
      const s = saldos[c.id]?.[cat.key]?.[chave];
      const totalDisponivel = s? s.totalDisponivel : 0;
      const meta = s? s.meta : (getMetasDoMes(mes,ano)[cat.key]||cat.metaDefault);
      totais[cat.key] = totalDisponivel;
      frescos[cat.key] = Math.max(0, s? s.creditos : 0);
      percentuais[cat.key] = meta>0 ? (totalDisponivel/meta*100) : 0;
    });
    const percentuaisCapped = CATEGORIAS.map(cat=>Math.min(100,percentuais[cat.key]));
    const pontuacao = percentuaisCapped.reduce((a,b)=>a+b,0)/CATEGORIAS.length;
    const percentuaisReais = CATEGORIAS.map(cat=>percentuais[cat.key]);
    const mediaReal = percentuaisReais.reduce((a,b)=>a+b,0)/CATEGORIAS.length;
    const metaAtingida = CATEGORIAS.every(cat=>percentuais[cat.key]>=100);
    const totalMateriais = Math.round(CATEGORIAS.reduce((a,cat)=>a+frescos[cat.key],0));
    return { colaborador:c, totais, percentuais, pontuacao, mediaReal, metaAtingida, totalMateriais };
  });
  resultados.sort((a,b)=> b.pontuacao-a.pontuacao || b.mediaReal-a.mediaReal || a.colaborador.nome.localeCompare(b.colaborador.nome));
  let posAtual=0, vistos=0, ultimoScore=null, ultimaMedia=null;
  resultados.forEach(r=>{
    vistos++;
    const empatado = ultimoScore!==null && Math.abs(r.pontuacao-ultimoScore)<0.001 && Math.abs(r.mediaReal-ultimaMedia)<0.001;
    if(!empatado) posAtual = vistos;
    r.posicao = posAtual;
    ultimoScore = r.pontuacao; ultimaMedia = r.mediaReal;
  });
  return resultados;
}
function calcularResultadosMes(mes,ano,setorFiltro){
  const saldos = calcularSaldosAcumulados(mes,ano);
  return resultadosDoMesUsandoSaldos(saldos, mes, ano, setorFiltro);
}
function setoresExistentes(){
  return [...new Set(STATE.colaboradores.map(c=>c.setor).filter(Boolean))].sort();
}
function mesesComDados(){
  const chaves = new Set();
  STATE.entregas.forEach(e=>{ if(e.data) chaves.add(e.data.slice(0,7)); });
  Object.keys(STATE.config.metasHistorico||{}).forEach(k=>chaves.add(k));
  return [...chaves].sort().reverse();
}

}
function calcularResumoCampanha(saldosCompletos, mesesCampanha){
  const porColaborador = {};
  mesesCampanha.forEach(({mes,ano})=>{
    const resultados = resultadosDoMesUsandoSaldos(saldosCompletos, mes, ano);
    resultados.forEach(r=>{
      if(!porColaborador[r.colaborador.id]){
        porColaborador[r.colaborador.id] = { colaborador:r.colaborador, mesesParticipando:0, somaPontuacao:0, totalMateriais:0, mesesComMetaAtingida:0 };
      }
      const acc = porColaborador[r.colaborador.id];
      acc.mesesParticipando++;
      acc.somaPontuacao += r.pontuacao;
      acc.totalMateriais += r.totalMateriais;
      if(r.metaAtingida) acc.mesesComMetaAtingida++;
    });
  });
  const lista = Object.values(porColaborador).map(acc=> ({
    ...acc, mediaPontuacao: acc.mesesParticipando? acc.somaPontuacao/acc.mesesParticipando : 0
  }));
  lista.sort((a,b)=> b.mediaPontuacao-a.mediaPontuacao || b.totalMateriais-a.totalMateriais);
  return lista;
}
function ultimosMeses(n){
  const out=[]; let {mes,ano}=mesAnoAtual();
  for(let i=0;i<n;i++){ out.unshift({mes,ano}); mes--; if(mes<1){mes=12;ano--;} }
  return out;
}

          <div style="position:absolute;inset:0;background:var(--verde-500);border-radius:6px 6px 0 0;"></div>
        </div>
        <span style="font-size:10.5px;color:var(--text-muted);">${d.label}</span>

}

function processarCsv(input){
  const file = input.files[0]; if(!file) return;

    const linhas = res.data.map(r=>{
      const keys = Object.keys(r); const get=(name)=>{ const k=keys.find(k=>k.toLowerCase().trim()===name); return k? (r[k]||'').trim() : ''; };
      return { nome:get('nome'), setor:get('setor'), cargo:get('cargo') };
    }).filter(r=>r.nome);
    if(linhas.length===0){ document.getElementById('csvPreview').innerHTML = `<div class="small-note" style="color:var(--vermelho);">Nenhum colaborador válido encontrado no arquivo.</div>`; return; }
    window._csvImportPreview = linhas;

      <div class="banner"><b>${linhas.length} colaborador(es) encontrados</b>Confira antes de importar.</div>
      <div class="table-wrap" style="max-height:220px;overflow-y:auto;"><table><thead><tr><th>Nome</th><th>Setor</th><th>Cargo</th></tr></thead>

  const tipo = document.getElementById('fTipo').value;
  const quantidade = parseFloat(document.getElementById('fQtd').value);
  const unidadeEl = document.getElementById('fUnidade');
  const unidade = unidadeEl ? unidadeEl.value : 'unidades';
  const responsavelContagem = document.getElementById('fResp').value.trim();
  const observacoes = document.getElementById('fObs').value.trim();
  const statusValidacao = document.getElementById('fStatusValid').value;
  if(!data || !colaboradorId || !tipo || isNaN(quantidade) || quantidade<0){ alert('Preencha data, colaborador, tipo de material e uma quantidade válida.'); return; }
  const payload = {data,colaboradorId,tipo,quantidade,unidade,responsavelContagem,observacoes,statusValidacao};
  if(id){
    const idx = STATE.entregas.findIndex(x=>x.id===id);
    STATE.entregas[idx] = {...STATE.entregas[idx], ...payload};
  } else {
    STATE.entregas.push({id:uid(), criadoEm:Date.now(), ...payload});
  }
  await garantirSnapshotMetas(+data.slice(5,7), +data.slice(0,4));
  await salvarEntregas();
  fecharModal(); renderApp();
}

    <p class="small-note" style="margin-top:-6px;">Move o crédito de material entre colaboradores, entre categorias, ou os dois ao mesmo tempo. Por exemplo, trocar latinhas por embalagens plásticas do mesmo colaborador, ou passar parte da meta de um colaborador para outro, com autorização administrativa.</p>
    <div class="field"><label>Data da transferência</label><input type="date" id="tData" value="${new Date().toISOString().slice(0,10)}" onchange="atualizarSaldoTransferencia()"></div>
    <div class="section-title" style="margin:16px 0 8px 0;font-size:13.5px;">De (origem)</div>
    <div class="grid grid-2">
      <div class="field"><label>Colaborador</label><select id="tColabOrigem" onchange="atualizarSaldoTransferencia()">${opcoesColab}</select></div>
      <div class="field"><label>Categoria</label><select id="tCategoriaOrigem" onchange="atualizarSaldoTransferencia()">${opcoesCategoria}</select></div>
    </div>
    <div class="small-note" id="saldoOrigemInfo" style="margin:-6px 0 14px 0;">—</div>
    <div class="section-title" style="margin:0 0 8px 0;font-size:13.5px;">Para (destino)</div>
    <div class="grid grid-2">
      <div class="field"><label>Colaborador</label><select id="tColabDestino">${opcoesColab}</select></div>
      <div class="field"><label>Categoria</label><select id="tCategoriaDestino">${opcoesCategoria}</select></div>
    </div>
    <div class="field"><label>Quantidade (unidades equivalentes)</label><input type="number" min="0" step="1" id="tQuantidade" oninput="atualizarSaldoTransferencia()"></div>
    <div class="field"><label>Motivo / observação</label><input type="text" id="tMotivo" placeholder="Ex: acordo entre colaboradores, correção de lançamento"></div>
    <div id="transfErro" style="color:var(--vermelho);font-size:12.5px;display:none;margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary btn-block" onclick="salvarTransferencia()">${icon('check',16)}Transferir</button>
    </div>
  `);
  setTimeout(atualizarSaldoTransferencia, 30);
}
function atualizarSaldoTransferencia(){
  const dataEl = document.getElementById('tData');
  const colabEl = document.getElementById('tColabOrigem');
  const catEl = document.getElementById('tCategoriaOrigem');
  const info = document.getElementById('saldoOrigemInfo');
  if(!dataEl || !colabEl || !catEl || !info) return;
  const data = dataEl.value; if(!data) return;
  const mes = +data.slice(5,7), ano = +data.slice(0,4);
  const saldo = saldoDisponivelAntes(colabEl.value, catEl.value, mes, ano);
  const cat = CATEGORIA_MAP[catEl.value];
  info.innerHTML = `Saldo disponível deste colaborador em ${escapeHtml(cat?cat.label.split(' (')[0]:'')} até ${nomeMes(mes)}/${ano}: <b>${saldo.toFixed(0)}</b> unidades equivalentes.`;
}
window.atualizarSaldoTransferencia = atualizarSaldoTransferencia;
async function salvarTransferencia(){
  const data = document.getElementById('tData').value;
  const colaboradorOrigemId = document.getElementById('tColabOrigem').value;
  const categoriaOrigem = document.getElementById('tCategoriaOrigem').value;
  const colaboradorDestinoId = document.getElementById('tColabDestino').value;
  const categoriaDestino = document.getElementById('tCategoriaDestino').value;
  const quantidade = parseFloat(document.getElementById('tQuantidade').value);
  const motivo = document.getElementById('tMotivo').value.trim();
  const erroEl = document.getElementById('transfErro');
  erroEl.style.display='none';
  if(!data || !colaboradorOrigemId || !colaboradorDestinoId || isNaN(quantidade) || quantidade<=0){
    erroEl.textContent = 'Preencha data, colaboradores e uma quantidade maior que zero.'; erroEl.style.display='block'; return;
  }
  if(colaboradorOrigemId===colaboradorDestinoId && categoriaOrigem===categoriaDestino){
    erroEl.textContent = 'Origem e destino são iguais. Escolha um colaborador ou categoria diferente para o destino.'; erroEl.style.display='block'; return;
  }
  const mes = +data.slice(5,7), ano = +data.slice(0,4);
  const saldoAtual = saldoDisponivelAntes(colaboradorOrigemId, categoriaOrigem, mes, ano);
  if(quantidade > saldoAtual){
    erroEl.textContent = `Quantidade maior que o saldo disponível na origem (${saldoAtual.toFixed(0)} unidades equivalentes até este mês).`; erroEl.style.display='block'; return;
  }
  STATE.transferencias.push({
    id:uid(), data, colaboradorOrigemId, categoriaOrigem, colaboradorDestinoId, categoriaDestino,
    quantidade, motivo, criadoEm:Date.now()
  });
  await garantirSnapshotMetas(mes,ano);
  await salvarTransferencias();
  fecharModal(); renderApp();
}
function confirmarExcluirTransferencia(id){
  if(!exigirAdmin()) return;
  abrirModal(`
    <div class="modal-head"><h3>Excluir transferência</h3><button class="modal-close" onclick="fecharModal()">${icon('x')}</button></div>
    <p>Tem certeza que deseja excluir esta transferência? O material volta a contar para o colaborador e categoria de origem.</p>
    <div class="modal-actions">
      <button class="btn btn-outline btn-block" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-danger btn-block" onclick="excluirTransferencia('${id}')">${icon('trash',16)}Excluir</button>
    </div>
  `);
}
async function excluirTransferencia(id){
  STATE.transferencias = STATE.transferencias.filter(x=>x.id!==id);
  await salvarTransferencias();
  fecharModal(); renderApp();
}
window.abrirFormTransferencia=abrirFormTransferencia; window.salvarTransferencia=salvarTransferencia;
window.confirmarExcluirTransferencia=confirmarExcluirTransferencia; window.excluirTransferencia=excluirTransferencia;

function renderPodium(r,pos,medal){
  return `<div class="podium-card podium-${pos}">
    <div class="podium-medal">${medal}</div>
    <div class="podium-name">${escapeHtml(r.colaborador.nome)}</div>
    <div class="podium-score">${r.pontuacao.toFixed(0)} pts</div>
    <div style="font-size:11px;opacity:.9;">${r.percentuais && r.pontuacao? Math.round(r.mediaReal)+'% da meta':''}</div>

function renderTabelaRanking(resultados, completa){
  if(resultados.length===0) return `<div class="table-empty">Nenhum resultado neste período.</div>`;
  return `
    <table><thead><tr>
      <th>Pos.</th><th>Colaborador</th><th>Setor</th><th>Pontuação</th><th>% cumprimento</th>${completa?'<th>Materiais</th>':''}<th>Meta</th>
    </tr></thead>
    <tbody>
      ${resultados.map(r=>`
        <tr>
          <td><b>${r.posicao}º</b>${r.posicao<=3?' '+({1:'🥇',2:'🥈',3:'🥉'}[r.posicao]||''):''}</td>
          <td style="font-weight:700;">${escapeHtml(r.colaborador.nome)}</td>
          <td>${escapeHtml(r.colaborador.setor||'—')}</td>
          <td style="min-width:120px;"><div style="display:flex;align-items:center;gap:8px;"><div class="progress" style="flex:1;"><div style="width:${Math.min(100,r.pontuacao)}%"></div></div><span>${r.pontuacao.toFixed(0)}</span></div></td>
          <td>${r.mediaReal.toFixed(0)}%</td>
          ${completa?`<td>${r.totalMateriais.toLocaleString('pt-BR')}</td>`:''}
          <td>${r.metaAtingida? '<span class="badge badge-green">Atingida</span>' : '<span class="badge badge-grey">Em andamento</span>'}</td>
        </tr>`).join('')}
    </tbody></table>
  `;
}

function montarMensagemTop3(mes,ano){
  const resultados = calcularResultadosMes(mes,ano);
  const top3 = resultados.slice(0,3);
  const medalhas = ['🥇 1º lugar','🥈 2º lugar','🥉 3º lugar'];
  let msg = `♻️ RANKING RECICLAR É CUIDAR DA CASA COMUM\n`;
  msg += `APAC DE IMPERATRIZ\n\n`;
  msg += `Resultado do mês: ${nomeMes(mes)} de ${ano}\n\n`;
  msg += `🏆 TOP 3 COLABORADORES\n\n`;
  top3.forEach((r,i)=>{
    msg += `${medalhas[i]}: ${r.colaborador.nome}\nPontuação: ${r.pontuacao.toFixed(0)} pontos\nMeta atingida: ${r.mediaReal.toFixed(0)}%\n\n`;
  });
  const totalMateriais = resultados.reduce((a,r)=>a+r.totalMateriais,0);
  const atingiramMeta = resultados.filter(r=>r.metaAtingida).length;
  msg += `📊 RESULTADO GERAL\n\n`;
  msg += `Colaboradores participantes: ${resultados.length}\n`;
  msg += `Colaboradores que atingiram a meta: ${atingiramMeta}\n`;
  msg += `Total de materiais arrecadados: ${totalMateriais.toLocaleString('pt-BR')} unidades\n\n`;
  msg += `🌱 Parabéns a todos que contribuíram com a campanha!`;
  return msg;
}
function montarMensagemCompleta(mes,ano){
  const resultados = calcularResultadosMes(mes,ano);
  let msg = `♻️ RANKING COMPLETO — RECICLAR É CUIDAR DA CASA COMUM\nAPAC DE IMPERATRIZ\n${nomeMes(mes)} de ${ano}\n\n`;
  resultados.forEach(r=>{ msg += `${r.posicao}º — ${r.colaborador.nome}: ${r.pontuacao.toFixed(0)} pontos (${r.mediaReal.toFixed(0)}% da meta)\n`; });
  msg += `\n🌱 Cuidar da casa comum é responsabilidade de todos!`;
  return msg;
}

/* ---------- CARD PNG PARA WHATSAPP ---------- */
function gerarCardRanking(mes,ano){
  const resultados = calcularResultadosMes(mes,ano);
  const top3 = resultados.slice(0,3);
  const W=1080,H=1350;
  const canvas = document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#173B27'); grad.addColorStop(1,'#0D2116');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  // leaf watermark circle
  ctx.globalAlpha=0.08; ctx.fillStyle='#8FCB9E'; ctx.beginPath(); ctx.arc(W-120,160,260,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;

  ctx.textAlign='center';
  ctx.fillStyle='#8FCB9E'; ctx.font='600 34px Georgia, serif'; ctx.fillText('♻️ RECICLAR É CUIDAR', W/2, 120);
  ctx.fillText('DA CASA COMUM', W/2, 165);
  ctx.fillStyle='#DCEBDF'; ctx.font='500 26px Georgia, serif'; ctx.fillText('APAC de Imperatriz — Maranhão', W/2, 210);
  ctx.fillStyle='#B9CDC0'; ctx.font='400 24px Arial'; ctx.fillText(`Resultado do mês: ${nomeMes(mes)} de ${ano}`, W/2, 250);

  ctx.fillStyle='#ffffff'; ctx.font='700 36px Georgia, serif'; ctx.fillText('🏆 TOP 3 COLABORADORES', W/2, 340);

  const medalColors = ['#C08A22','#9AA6AE','#B0703F'];
  const medals = ['🥇','🥈','🥉'];
  let y = 420;
  top3.forEach((r,i)=>{
    ctx.fillStyle='rgba(255,255,255,0.06)';
    roundRect(ctx,90,y-50,W-180,120,18); ctx.fill();
    ctx.strokeStyle=medalColors[i]; ctx.lineWidth=3; roundRect(ctx,90,y-50,W-180,120,18); ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle='#ffffff'; ctx.font='44px Arial'; ctx.fillText(medals[i], 120, y+20);
    ctx.font='700 32px Georgia, serif'; ctx.fillText(truncar(r.colaborador.nome,26), 200, y-5);
    ctx.font='400 24px Arial'; ctx.fillStyle='#C9DCCE';
    ctx.fillText(`${r.pontuacao.toFixed(0)} pontos · Meta atingida: ${r.mediaReal.toFixed(0)}%`, 200, y+35);
    y += 150;
  });

  const totalMateriais = resultados.reduce((a,r)=>a+r.totalMateriais,0);
  const atingiramMeta = resultados.filter(r=>r.metaAtingida).length;
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff'; ctx.font='700 32px Georgia, serif'; ctx.fillText('📊 RESULTADO GERAL', W/2, y+40);
  ctx.font='400 26px Arial'; ctx.fillStyle='#DCEBDF';
  ctx.fillText(`Participantes: ${resultados.length}   ·   Atingiram a meta: ${atingiramMeta}`, W/2, y+90);
  ctx.fillText(`Total arrecadado: ${totalMateriais.toLocaleString('pt-BR')} unidades`, W/2, y+130);

  ctx.font='italic 28px Georgia, serif'; ctx.fillStyle='#8FCB9E';
  wrapText(ctx,'🌱 Parabéns a todos que contribuíram com a campanha!', W/2, y+210, W-160, 36);

  canvas.toBlob(async (blob)=>{
    const url = URL.createObjectURL(blob);
    const fname = `ranking-${nomeMes(mes)}-${ano}.png`;
    if(navigator.canShare && navigator.canShare({files:[new File([blob],fname,{type:'image/png'})]})){
      try{ await navigator.share({files:[new File([blob],fname,{type:'image/png'})], title:'Ranking Reciclar é Cuidar da Casa Comum'}); return; }catch(e){}
    }
    const a = document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    abrirModal(`<div class="modal-head"><h3>Card gerado</h3><button class="modal-close" onclick="fecharModal()">${icon('x')}</button></div>
      <img src="${url}" style="width:100%;border-radius:12px;border:1px solid var(--border);">
      <p class="small-note" style="margin-top:10px;">A imagem foi baixada para o seu aparelho. Abra o WhatsApp e anexe o arquivo para compartilhar.</p>`);
  }, 'image/png');
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function truncar(s,n){ return s.length>n? s.slice(0,n-1)+'…' : s; }
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words = text.split(' '); let line=''; let lines=[];
  words.forEach(w=>{ const test=line+w+' '; if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w+' '; } else line=test; });
  lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, y+i*lineHeight));
}
window.gerarCardRanking = gerarCardRanking;

function renderTabelaEntregasHistorico(mes,ano){
  const chave = chaveMA(mes,ano);

  return `<table><thead><tr><th>Data</th><th>Colaborador</th><th>Material</th><th>Qtd.</th><th>Status</th></tr></thead>
    <tbody>${lista.map(e=>{
      const c = STATE.colaboradores.find(x=>x.id===e.colaboradorId);
      const cat = CATEGORIA_MAP[e.tipo];
      return `<tr><td>${formatarData(e.data)}</td><td>${escapeHtml(c?c.nome:'(removido)')}</td><td>${cat?escapeHtml(cat.label.split(' (')[0]):'Outros'}</td><td>${e.quantidade}</td><td>${e.statusValidacao==='validado'?'<span class="badge badge-green">Validado</span>':'<span class="badge badge-amber">Pendente</span>'}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function baixarArquivo(conteudo, nome, tipo){
  const blob = new Blob([conteudo],{type:tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
function exportarCsvEntregas(mes,ano){
  const chave = chaveMA(mes,ano);
  const lista = STATE.entregas.filter(e=>e.data && e.data.slice(0,7)===chave);
  let csv = 'Data,Colaborador,Setor,Material,Quantidade,Unidade,Status,ResponsavelContagem,Observacoes\n';
  lista.forEach(e=>{
    const c = STATE.colaboradores.find(x=>x.id===e.colaboradorId);
    const cat = CATEGORIA_MAP[e.tipo];
    const linha = [e.data, c?c.nome:'', c?c.setor:'', cat?cat.label:'Outros', e.quantidade, e.unidade, e.statusValidacao, e.responsavelContagem||'', (e.observacoes||'').replace(/,/g,';')];
    csv += linha.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  baixarArquivo(csv, `entregas-${nomeMes(mes)}-${ano}.csv`, 'text/csv;charset=utf-8;');
}
window.exportarCsvEntregas = exportarCsvEntregas;

/* =========================================================
   RELATÓRIOS
   ========================================================= */
function renderRelatorios(){
  const mes=STATE.rankMes, ano=STATE.rankAno;
  return `
    <div class="grid grid-3">
      <div class="card">
        <div class="stat-label">Ranking do mês (CSV)</div>
        <p class="small-note">Exporta posição, pontuação e percentuais de todos os colaboradores no mês selecionado.</p>
        <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="exportarCsvRanking(${mes},${ano})">${icon('download')}Exportar ranking</button>
      </div>
      <div class="card">
        <div class="stat-label">Entregas do mês (CSV)</div>
        <p class="small-note">Exporta todos os registros individuais de entrega do mês selecionado.</p>
        <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="exportarCsvEntregas(${mes},${ano})">${icon('download')}Exportar entregas</button>
      </div>
      <div class="card">
        <div class="stat-label">Colaboradores (CSV)</div>
        <p class="small-note">Exporta a lista completa de colaboradores cadastrados.</p>
        <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="exportarCsvColaboradores()">${icon('download')}Exportar colaboradores</button>
      </div>
      <div class="card">
        <div class="stat-label">Transferências do mês (CSV)</div>
        <p class="small-note">Exporta as transferências de material entre colaboradores e categorias no mês selecionado.</p>
        <button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="exportarCsvTransferencias(${mes},${ano})">${icon('download')}Exportar transferências</button>
      </div>
    </div>
    <div class="section-title">Mês de referência para os relatórios</div>
    <div class="card">${seletorMesAno('rank', mes, ano)} <span class="small-note">Este seletor é compartilhado com a tela de Ranking.</span></div>
  `;
}
function exportarCsvRanking(mes,ano){
  const resultados = calcularResultadosMes(mes,ano);
  let csv = 'Posicao,Colaborador,Setor,Pontuacao,PercentualMedio,MetaAtingida,TotalMateriais\n';
  resultados.forEach(r=>{
    csv += [r.posicao, r.colaborador.nome, r.colaborador.setor||'', r.pontuacao.toFixed(1), r.mediaReal.toFixed(1), r.metaAtingida?'Sim':'Nao', r.totalMateriais]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  baixarArquivo(csv, `ranking-${nomeMes(mes)}-${ano}.csv`,'text/csv;charset=utf-8;');
}
function exportarCsvColaboradores(){
  let csv = 'Nome,Setor,Cargo,Status,DataCadastro\n';
  STATE.colaboradores.forEach(c=>{ csv += [c.nome,c.setor||'',c.cargo||'',c.status,c.dataCadastro].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n'; });
  baixarArquivo(csv,'colaboradores.csv','text/csv;charset=utf-8;');
}
function exportarCsvTransferencias(mes,ano){
  const lista = transferenciasDoMes(mes,ano);
  let csv = 'Data,ColaboradorOrigem,CategoriaOrigem,ColaboradorDestino,CategoriaDestino,Quantidade,Motivo\n';
  lista.forEach(t=>{
    const origem = STATE.colaboradores.find(x=>x.id===t.colaboradorOrigemId);
    const destino = STATE.colaboradores.find(x=>x.id===t.colaboradorDestinoId);
    const catO = CATEGORIA_MAP[t.categoriaOrigem], catD = CATEGORIA_MAP[t.categoriaDestino];
    csv += [t.data, origem?origem.nome:'', catO?catO.label:'', destino?destino.nome:'', catD?catD.label:'', t.quantidade, (t.motivo||'').replace(/,/g,';')]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  baixarArquivo(csv, `transferencias-${nomeMes(mes)}-${ano}.csv`, 'text/csv;charset=utf-8;');
}
window.exportarCsvRanking=exportarCsvRanking; window.exportarCsvColaboradores=exportarCsvColaboradores; window.exportarCsvTransferencias=exportarCsvTransferencias;

/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */
function renderConfig(){
  const metas = STATE.config.metasDefault;
  const janelaAtual = STATE.config.janelaPainelMeses;
  return `
    ${!STATE.isAdmin? `<div class="banner"><span>${icon('config')}</span><div><b>Área protegida.</b> Entre no modo administrador para alterar metas, senha ou apagar dados de teste.</div></div>`:''}
    <div class="section-title">Painel geral</div>
    <div class="card">
      <p class="small-note">Escolha quanto tempo o gráfico de evolução e o resumo de acompanhamento do Painel geral devem mostrar.</p>
      <div class="field" style="max-width:280px;">
        <label>Período mostrado no painel</label>
        <select onchange="mudarJanelaPainel(this.value)">
          <option value="3" ${janelaAtual===3?'selected':''}>Últimos 3 meses</option>
          <option value="6" ${janelaAtual===6?'selected':''}>Últimos 6 meses</option>
          <option value="12" ${janelaAtual===12?'selected':''}>Últimos 12 meses</option>
          <option value="campanha" ${janelaAtual==='campanha'?'selected':''}>Desde o início da campanha (mai/2026)</option>
        </select>
      </div>
    </div>

    <div class="section-title">Metas mensais (aplicadas a partir de agora)</div>
    <div class="card">
      <p class="small-note">Alterar uma meta aqui vale para os próximos meses. Meses já registrados mantêm a meta que estava em vigor na época, conforme o regulamento.</p>
      <div class="grid grid-2" style="margin-top:12px;">
        ${CATEGORIAS.map(c=>`
          <div class="field"><label>${escapeHtml(c.label)}</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="number" min="0" id="meta_${c.key}" value="${metas[c.key]}" ${!STATE.isAdmin?'disabled':''}>
              <span class="small-note" style="white-space:nowrap;">${c.unidade}</span>
            </div>
          </div>`).join('')}
      </div>
      <button class="btn btn-primary" ${!STATE.isAdmin?'disabled':''} onclick="salvarMetasDefault()">${icon('check',16)}Salvar novas metas</button>
    </div>

    <div class="section-title">Segurança</div>
    <div class="card">
      <div class="field"><label>Alterar senha do administrador</label>
        <div style="display:flex;gap:8px;">
          <input type="password" id="novaSenhaAdmin" placeholder="Nova senha" ${!STATE.isAdmin?'disabled':''}>
          <button class="btn btn-outline" ${!STATE.isAdmin?'disabled':''} onclick="alterarSenhaAdmin()">Salvar</button>
        </div>
      </div>
    </div>

    ${STATE.config.temDadosTeste? `
    <div class="section-title">Dados de demonstração</div>
    <div class="card">
      <p class="small-note">O aplicativo foi iniciado com colaboradores e entregas fictícias para mostrar como o ranking funciona. Apague-os quando começar a usar dados reais.</p>
      <button class="btn btn-danger" ${!STATE.isAdmin?'disabled':''} onclick="apagarDadosTeste()">${icon('trash',16)}Apagar dados de teste</button>
    </div>` : ''}

    <div class="section-title">Conexão dos dados</div>
    <div class="card">
      ${STORAGE_MODE==='claude'? `<p class="small-note">Os dados estão salvos no armazenamento do Claude, compartilhado com qualquer pessoa que abra este mesmo link.</p>`
        : STORAGE_MODE==='firestore'? `<p class="small-note">Os dados estão salvos no banco de dados Firebase deste app, compartilhado com qualquer pessoa que abra este site.</p>`
        : `<div class="banner amber"><b>Atenção: modo local.</b><div>Os dados estão salvos só neste navegador e não são vistos por outras pessoas nem por outros aparelhos. Isso normalmente acontece antes de o banco de dados Firebase ser configurado no código do app.</div></div>`}
    </div>

    <div class="section-title">Sobre a campanha</div>
    <div class="card">
      <p style="font-size:13.5px;line-height:1.7;">
        <b>Reciclar é Cuidar da Casa Comum</b> é a campanha de arrecadação de material reciclável da
        Associação de Proteção e Assistência aos Condenados de Imperatriz, Maranhão. O ranking acompanha
        o cumprimento das metas mensais estabelecidas no regulamento da campanha e serve como ferramenta
        de acompanhamento e incentivo, sem substituir as regras oficiais.
      </p>
    </div>
  `;
}
async function salvarMetasDefault(){
  if(!exigirAdmin()) return;
  const novasMetas = {};
  CATEGORIAS.forEach(c=>{ novasMetas[c.key] = parseFloat(document.getElementById('meta_'+c.key).value) || c.metaDefault; });
  STATE.config.metasDefault = novasMetas;
  await salvarConfig();
  alert('Metas atualizadas para os próximos meses.');
  renderApp();
}
async function alterarSenhaAdmin(){
  if(!exigirAdmin()) return;
  const v = document.getElementById('novaSenhaAdmin').value.trim();
  if(!v){ alert('Informe uma nova senha.'); return; }
  STATE.config.senhaAdmin = v;
  await salvarConfig();
  alert('Senha atualizada.');
  renderApp();
}
async function apagarDadosTeste(){
  if(!exigirAdmin()) return;
  if(!confirm('Isso vai apagar TODOS os colaboradores e entregas cadastrados atualmente (dados de teste). Deseja continuar?')) return;
  STATE.colaboradores = []; STATE.entregas = [];
  STATE.config.temDadosTeste = false;
  await salvarColaboradores(); await salvarEntregas(); await salvarConfig();
  renderApp();
}
window.salvarMetasDefault=salvarMetasDefault; window.alterarSenhaAdmin=alterarSenhaAdmin; window.apagarDadosTeste=apagarDadosTeste;

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
async function iniciar(){
  await detectarModoArmazenamento();
  await carregarDados();
  if(sessionStorage.getItem('reciclar-apac:isAdmin')==='1') STATE.isAdmin = true;
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderApp();
  // pós-render: preencher tabelas filtráveis que dependem de elementos já no DOM
  if(STATE.view==='colaboradores') renderTabelaColaboradores();
  if(STATE.view==='entregas') renderTabelaEntregas();
}
const _origRenderApp = renderApp;
renderApp = function(){
  _origRenderApp();
  if(STATE.view==='colaboradores') setTimeout(renderTabelaColaboradores,0);
  if(STATE.view==='entregas') setTimeout(renderTabelaEntregas,0);
};
iniciar();
</script>
